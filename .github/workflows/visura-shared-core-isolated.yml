name: VISURA shared-core isolated checks
on:
  push:
    branches:
      - architecture/visura-shared-core-20261027
    paths:
      - "architecture/**"
      - ".github/workflows/visura-shared-core-isolated.yml"
  pull_request:
    paths:
      - "architecture/**"
      - ".github/workflows/visura-shared-core-isolated.yml"
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visura_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate BC batches (no network)
        run: node --test architecture/tests/*.test.mjs
      - name: Apply synthetic schema to disposable Postgres 16
        run: |
          PG_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/00_bootstrap_pg16.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/drafts/visura_shared_schema_UNAPPLIED.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/20_verify_pg16.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/drafts/visura_shared_read_contracts_UNAPPLIED.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/30_verify_read_contract_pg16.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/drafts/visura_shared_internal_publish_UNAPPLIED.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/40_verify_publication_pg16.sql

      - name: Simulate two PostgreSQL sessions targeting same warehouse
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/50_hold_warehouse_lock_pg16.sql > /tmp/visura-shared-holder.log 2>&1 &
          HOLDER_PID=$!
          trap 'kill "$HOLDER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if docker exec "$PG_CONTAINER" test -f /tmp/visura_shared_cor_lock_ready; then ready=1; break; fi
            if ! kill -0 "$HOLDER_PID" 2>/dev/null; then
              cat /tmp/visura-shared-holder.log
              exit 1
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/visura-shared-holder.log
            echo "Timed out waiting for database warehouse row lock" >&2
            exit 1
          fi
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/51_conflicting_publisher_pg16.sql
          wait "$HOLDER_PID"
          trap - EXIT
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/52_verify_after_concurrency_pg16.sql

      - name: Guard immutability of validated BC batches in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/drafts/visura_shared_staging_guard_UNAPPLIED.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/60_verify_staging_immutability_pg16.sql
