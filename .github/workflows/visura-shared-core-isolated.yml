name: VISURA shared-core isolated checks
on:
  push:
    branches:
      - architecture/visura-shared-core-20261027
    paths:
      - "architecture/**"
      - ".github/workflows/visura-shared-core-isolated.yml"
  pull_request:
    paths:
      - "architecture/**"
      - ".github/workflows/visura-shared-core-isolated.yml"
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visura_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate BC batches (no network)
        run: node --test architecture/tests/*.test.mjs
      - name: Apply synthetic schema to disposable Postgres 16
        run: |
          PG_CONTAINER=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/00_bootstrap_pg16.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/drafts/visura_shared_schema_UNAPPLIED.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d visura_test -v ON_ERROR_STOP=1 < architecture/tests/sql/20_verify_pg16.sql
