<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST={

let data=load(),screen='home',activeAisle='',activeLoc='',activeArticle='',cMode='direct',cStep=0,cInput='',cParts=[0,0,0,0],pendingEntries=[],pendingResult=null,modal='',verifyValue='',countFeedback='',savedFeedback='',locationFilter='all',lastPallet=null,repeatMode=false,overwriteInput=false,resumedDraft=false,editReason='',editOriginal=null,editReasonChoice='',editReasonNote='',editingIndex=-1,entryEdits=[];

// La modalidad se mantiene por jornada hasta realizar un relevo explícito.
function sessionWorkers(){
 const crew=data.countSession?.workers;
 return Array.isArray(crew)&&crew.length&&crew[0]===data.worker?[...new Set(crew.filter(Boolean))]:data.worker?[data.worker]:[];
}

function renderSession(){
 const colleague=Object.keys(AISLES).filter(w=>w!==data.worker);
 place(`<div class="title"><div class="overline">MODALIDAD DE RECUENTO · DEMO</div><h1>¿Cómo vais a contar?</h1><p class="muted">Esta selección se mantiene entre ubicaciones. En la versión definitiva la asignará el supervisor.</p></div>
 <div class="card"><h2>👤 Recuento individual</h2><p class="muted">${esc(data.worker)} cuenta y registra las cantidades.</p><button class="btn btn-light" onclick="startSession('single')">Empezar individual →</button></div>
 <div class="card"><h2>👥 Recuento en pareja</h2><p class="muted">Dos personas cuentan juntas y utilizan un único móvil; se guarda un solo resultado con ambos nombres.</p>

 <div class="field"><label for="partnerPin">PIN del segundo operario (solo demo)</label><input class="input" id="partnerPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 cifras"></div>
 <button class="btn" onclick="startSession('pair')">Empezar en pareja →</button></div>
 <div class="alert">Esta versión funciona localmente y utiliza el PIN 1234 de prueba. No autentica realmente al segundo operario ni asigna permisos de supervisor.</div><p id="sessionError" class="muted" role="alert"></p>`,

function items(loc){let base=(TEST[loc]||[]).map(p=>({...p}));let unexpected=Object.entries(data.locations[loc]?.extras||{}).map(([id,v])=>({id,name:v.name||'Artículo encontrado no previsto',theoretical:0,extra:true}));return [...base,...unexpected];}

 if(!worker)return null;
 try{
  const d=JSON.parse(localStorage.getItem(draftKey(worker)));

let updateReady=false, updating=false, lastCheck=0, hadController=false, bootAt=Date.now(), reloadedForUpdate=false;

async function importBarcodeFile(input){
 const file=input?.files?.[0];if(!file)return;
 input.value='';
 if(file.size>2*1024*1024){alert('Archivo demasiado grande para la base de prueba (máximo 2 MB).');return;}
 try{
  const raw=JSON.parse(await file.text());
  if(raw?.schema!=='INVENTA_BARCODES_V1'||!raw.barcodes||typeof raw.barcodes!=='object'||Array.isArray(raw.barcodes))throw Error('Formato no reconocido');
  const rows=Object.entries(raw.barcodes);if(rows.length>20000)throw Error('Demasiados códigos');
  const known=new Set(Object.values(TEST).flat().map(p=>p.id));
  for(const loc of Object.values(data.locations))for(const id of Object.keys(loc.extras||{}))known.add(id);
  let loaded=0,conflicts=0,unknown=0;
  const pending=[];
  for(const [rawCode,entry] of rows){
    const code=barcodeKey(rawCode),id=String(entry?.articleId||'');
    if(!printableCode(code)||!known.has(id)){unknown++;continue;}
    const prior=codeForArticle(code);
    if(prior&&prior!==id){conflicts++;continue;}
    if(prior===id)continue;
    const at=new Date().toISOString();
    pending.push([code,{articleId:id,code,source:'INVENTA-import',createdAt:entry.createdAt||at,createdBy:entry.createdBy||'Importado',updatedAt:at}]);
  }
  if(!pending.length){alert('Sin asociaciones nuevas. Conflictos: '+conflicts+'; no reconocidas: '+unknown+'.');return;}
  if(!confirm('Importar '+pending.length+' códigos nuevos? Se omiten '+conflicts+' conflictos y '+unknown+' códigos no reconocidos.'))return;
  for(const [key,value] of pending){catalog()[key]=value;loaded++;}
  data.events.push({what:'Base de códigos importada',loaded,conflicts,unknown,at:new Date().toISOString()});save();
  alert('Importados '+loaded+' códigos. Conflictos omitidos: '+conflicts+'.');
 }catch(e){alert('No se pudo importar la base: '+e.message);}
}

function nextPending(){
 const list=items(activeLoc),curr=list.findIndex(p=>p.id===activeArticle);
 // Priorizar los que nunca fueron contados y no tienen incidencias.
 for(let step=1;step<=list.length;step++){
  const idx=(curr+step+list.length)%list.length;
  const p=list[idx];
  if(!statusArticle(activeLoc,p)&&!incidentArticle(activeLoc,p)){openArticle(p.id);return;}
 }
 // El resto requiere revisión: la ubicación sigue abierta.
 const issues=list.filter(p=>!isCountVerified(activeLoc,p));
 if(issues.length){savedFeedback='⚠ Quedan '+issues.length+' referencia(s) sin validar o con incidencia pendiente.';go('articles');return;}
 closeLocation();
}

tal-staged">● PROVISIONAL · SIN GUARDAR</div></div><div class="counter-footer"><button onclick="cancelCount()">${editOriginal!==null?"← Desglose":"← Artículos"}</button><button onclick="openBreakdown()">✎ Corregir</button><button onclick="prepareReview()">IR A CONFIRMAR →</button></div>`);drawCount();}

function repeatLastPallet(){

 cMode='pallet';repeatMode=true;cStep=0;cParts=lastPallet.slice();
 cInput=String(lastPallet[0]);overwriteInput=true;

function drawCount(){
 if(screen!=='count')return;
 const n=valid(cInput)?Number(cInput):0;
 const labels=['Número de palés','Cajas por base','Número de alturas','Unidades por caja'];
 const units=['PALÉS','CAJAS','ALTURAS','UNIDADES'];

 $('cDigits').textContent=cInput||'0';

 $('cStep').textContent=cMode==='direct'?'Introduce una cantidad suelta':repeatMode?'Repetir palés · cambia la cantidad':'Palés · paso '+(cStep+1)+' de 4';
 $('cProgress').textContent=cMode==='direct'?'DIRECTO':repeatMode?'REPETIR':(cStep+1)+'/4';
 const row=$('reusePalletRow');if(row)row.hidden=!(lastPallet&&lastPallet.length===4&&!repeatMode);
 let product=0;
 if(cMode==='direct'){$('cDesc').textContent='Cada añadido se suma al total provisional.';}
 else if(repeatMode){
  const factors=[n,...lastPallet.slice(1)];product=factors.reduce((a,b)=>a*b,1);
  $('cDesc').textContent=factors.join(' × ')+' = '+fmt(product)+' unidades';
 }else{
  const guide=[
   '¿Cuántos palés iguales quieres contar?',
   'Palés: '+cParts[0]+'. Indica las cajas de cada base.',
   cParts[0]+' palés × '+cParts[1]+' cajas/base. Indica las alturas.',
   'Si cada caja cuenta como una unidad, introduce 1.'
  ];
  if(cStep===3&&n){
   product=cParts[0]*cParts[1]*cParts[2]*n;
   $('cDesc').textContent=[...cParts.slice(0,3),n].join(' × ')+' = '+fmt(product)+' unidades';
  }else{$('cDesc').textContent=guide[cStep];}
 }
 $('cAction').textContent=cMode==='direct'?'+ AÑADIR CANTIDAD':repeatMode?'+ SUMAR PALÉS REPETIDOS':cStep<3?'SIGUIENTE ›':'+ SUMAR PALÉS AL TOTAL';
 const finalProduct=cMode==='pallet'&&(repeatMode||cStep===3);
 const tooLarge=finalProduct&&n&&(!Number.isSafeInteger(product)||product>99999999);
 $('cAction').disabled=!n||!!tooLarge;
 if(tooLarge)$('cDesc').textContent='Resultado demasiado grande. Revisa los factores.';
 $('cEntries').textContent=pendingEntries.length+' '+(pendingEntries.length===1?'apunte':'apuntes')+' realizados';

}
function actionDigit(){
 if(!valid(cInput))return;
 const n=Number(cInput);let added=0;
 if(cMode==='direct'){
  pendingEntries.push({kind:'directa',detail:n+' unidades',amount:n});added=n;cInput='';
 }else if(repeatMode){
  const factors=[n,...lastPallet.slice(1)];
  const amount=factors.reduce((a,b)=>a*b,1);
  if(!Number.isSafeInteger(amount)||amount>99999999)return;
  pendingEntries.push({kind:'palés',detail:factors[0]+' palés × '+factors[1]+' cajas/base × '+factors[2]+' alturas × '+factors[3]+' unidades/caja',factors,amount});
  lastPallet=factors.slice();added=amount;cStep=0;cInput='';cParts=[0,0,0,0];repeatMode=false;overwriteInput=false;
 }else{
  cParts[cStep]=n;
  if(cStep<3){cStep++;cInput='';countFeedback='Cálculo de palés en preparación. Falta completar los factores.';}
  else{
   const amount=cParts.reduce((a,b)=>a*b,1);
   if(!Number.isSafeInteger(amount)||amount>99999999)return;
   const factors=cParts.slice();
   pendingEntries.push({kind:'palés',detail:factors[0]+' palés × '+factors[1]+' cajas/base × '+factors[2]+' alturas × '+factors[3]+' unidades/caja',factors,amount});
   lastPallet=factors;added=amount;cStep=0;cInput='';cParts=[0,0,0,0];
  }
 }
 if(added)countFeedback='✓ +'+fmt(added)+' UNIDADES AÑADIDAS · TOTAL '+fmt(countTotal())+' · TODAVÍA SIN GUARDAR';
 drawCount();
}

function registerDiscrepancy(notFound=false){
 const p=getProduct();if(!p)return;

function commitCount(warning,notFound=false){

 const d=getLoc(activeLoc),prior=d.counts[activeArticle];
 if(prior&&!editReason){showModal('reason');return;}
 const rec={entries:pendingEntries.map(x=>({...x})),amount:countTotal(),notFound:false,warning:false,at:new Date().toISOString(),workers:prior?.workers||sessionWorkers(),countMode:prior?.countMode||sessionMode(),lastEditedBy:sessionWorkers()};
 if(prior){rec.corrections=[...(prior.corrections||[]),{oldAmount:prior.amount,newAmount:rec.amount,delta:rec.amount-prior.amount,originalEntries:cloneEntries(prior.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),reason:editReason,worker:data.worker,...sessionAudit(),at:rec.at}];}
 d.counts[activeArticle]=rec;
 const previousIssue=d.incidents[activeArticle];if(previousIssue)delete d.incidents[activeArticle];
 data.events.push({what:prior?'Corrección justificada':'Artículo contado',loc:activeLoc,article:activeArticle,oldAmount:prior?.amount??null,amount:rec.amount,reason:prior?editReason:null,originalEntries:cloneEntries(prior?.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),worker:data.worker,...sessionAudit(),at:rec.at});

}
