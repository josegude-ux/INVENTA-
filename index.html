.btn{width:100%;min-height:49px;border:0;border-radius:12px;background:#c61921;color:#fff;font-weight:900;font-size:15px;padding:9px 13px}.btn:disabled{opacity:.4}.btn-outline{border:1px solid #bdcad8;border-radius:12px;background:#fff;color:#1b4368;padding:10px 12px;min-height:44px;font-weight:800;font-size:14px}.btn-light{background:#f4f7fa;color:#35566e;border:1px solid #dae5ee}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stack{display:flex;flex-direction:column;gap:9px}.between{display:flex;align-items:center;justify-content:space-between;gap:11px}.progress{height:7px;background:#e4eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#279a67;transition:width .15s}.item{width:100%;border:1px solid #dce4ed;background:#fff;border-radius:15px;padding:15px;text-align:left;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:11px;min-height:71px}.item strong{display:block;font-size:16px}.item small{font-size:12px;color:#6a8095;display:block;margin-top:4px}.chev{font-size:26px;color:#a1b2c2}.tag{font-size:10px;border-radius:8px;padding:5px 7px;white-space:nowrap;background:#e9eff8;color:#45678c;font-weight:800}.tag.ok{color:#176b46;background:#e4f6ee}.tag.warn{color:#9d5210;background:#fff0dd}.alert{padding:11px 12px;border-radius:12px;background:#fff2df;border:1px solid #ffdbaa;color:#744215;font-size:13px;line-height:1.5;margin-bottom:11px}.alert.red{background:#fff0f1;color:#a52b31;border-color:#ffd5d8}.alert.green{background:#e6f6ed;color:#1c6441;border-color:#d3f1df}
footer{flex:none;border-top:1px solid #dde4ec;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff}.footerrow{display:flex;align-items:center;gap:10px}.footerrow .btn{flex:1}.back{color:#506780;background:none;border:0;font-weight:800;padding:8px 0;font-size:12px}.bigcheck{font-size:35px;line-height:1}
/* Contador B, el teclado seleccionado */
#app.counter{background:#111d2b}#app.counter header{background:#182538;color:white;border-color:#34465c}#app.counter header .brand small{color:#b1c8e0}#app.counter .pill{background:#3d2b35;color:#ffe5e5;border-color:#74515a}#app.counter main{background:#111d2b;color:#fff;display:flex;flex-direction:column;padding:10px 12px 8px;overflow-y:auto}#app.counter footer{background:#192a3e;color:white;border-color:#334960}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;flex:none}.modebar button{border:1px solid #43576f;border-radius:12px;padding:10px 5px;background:#2c3c54;color:#d9e6f2;font-size:13px;font-weight:900}.modebar button.on{background:#b8f3cf;color:#123d2a;border-color:#b8f3cf}
.cproduct{margin-bottom:9px;font-size:12px;color:#bdd0e6;flex:none}.cproduct b{display:block;font-size:16px;color:#fff}.display{background:#20324a;border:1px solid #3f5773;border-radius:16px;padding:10px 12px;flex:none}.display .caption{font-size:12px;color:#aac1d8;display:flex;justify-content:space-between}.digits{font-size:45px;font-weight:950;text-align:right;line-height:1.08;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}.desc{font-size:11px;color:#b0edd0;min-height:18px}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(37px,1fr));gap:7px;flex:1;min-height:188px;max-height:380px;margin:9px 0}.keypad button{font-size:24px;font-weight:850;background:#2e4058;color:white;border:1px solid #49617c;border-radius:13px;min-height:37px}.keypad button:active{background:#52708d}.keypad .ctl{font-size:14px;background:#455873}.addbtn{background:#b8f3cf;border:0;border-radius:13px;padding:11px;color:#123e2e;font-weight:950;font-size:15px;min-height:46px;flex:none}.addbtn:disabled{opacity:.4}.c-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#b7cbe1;padding-top:7px;flex:none}.c-tools button{border:0;color:#c6efd9;background:transparent;font-size:11px;font-weight:800}.counter-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.counter-total span{color:#b1c8df;font-size:11px;font-weight:900}.counter-total strong{font-size:32px;color:#b8f3cf;font-variant-numeric:tabular-nums}.counter-footer{display:flex;gap:8px;align-items:center;margin-top:6px}.counter-footer button{background:#354b67;color:white;border:0;border-radius:9px;padding:8px 9px;font-size:11px;font-weight:850}.counter-footer button:last-child{margin-left:auto;background:#c61921;padding:9px 13px;color:#fff}
.modalback{position:fixed;inset:0;background:#081a2ac9;z-index:8;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;color:#162d45;width:min(480px,100%);border-radius:18px;padding:18px;max-height:85dvh;overflow:auto}.modal h2{margin-bottom:9px}.modal .line{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5eaf0;font-size:12px}.modal .line button{border:0;border-radius:9px;background:#fff0f0;color:#a32329;padding:7px;font-weight:800}.modal-actions{display:flex;gap:8px;margin-top:13px}.modal-actions button{flex:1}
@media(max-height:740px){main{padding:9px}#app.counter main{padding:7px 10px 5px}.keypad{gap:5px;min-height:158px;margin:6px 0}.keypad button{min-height:32px}.display{padding:6px 10px}.digits{font-size:39px}.cproduct{margin-bottom:5px}.modebar{margin-bottom:5px}.modebar button{padding:7px}.counter-footer{margin-top:3px}.counter-total strong{font-size:27px}}
</style></head><body><div id="app"><header id="head"></header><main id="content"></main><footer id="foot"></footer></div><div id="overlay"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST={
 'K00-P01':[{id:'PRD0003563',name:"GINEBRA SEAGRAM'S 70 CL",theoretical:200},{id:'PRD0001287',name:'RON AÑEJO 70 CL',theoretical:30}],
 'K00-P02':[{id:'PRD0002411',name:'REFRESCO LIMÓN 33 CL',theoretical:72},{id:'PRD0001572',name:'AGUA MINERAL 50 CL',theoretical:24}],
 'K00-P03':[]};
const KEY='inventa-demo-operario-v015';
const blank=()=>({version:1,worker:'',locations:{},events:[]});
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.version===1&&p.locations)return p;}catch(e){}return blank();}
let data=load(),screen=data.worker?'locations':'login',activeLoc='',activeArticle='',cMode='direct',cStep=0,cInput='',cParts=[0,0,0],pendingEntries=[],pendingResult=null,modal='',verifyValue='';
const fmt=n=>Number(n).toLocaleString('es-ES');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid=s=>/^\d{1,8}$/.test(String(s))&&Number(s)>0&&Number.isSafeInteger(Number(s));
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function items(loc){let base=(TEST[loc]||[]).map(p=>({...p}));let unexpected=Object.entries(data.locations[loc]?.extras||{}).map(([id,v])=>({id,name:v.name||'Artículo encontrado no previsto',theoretical:0,extra:true}));return [...base,...unexpected];}
function getLoc(loc){return data.locations[loc]||(data.locations[loc]={verified:false,counts:{},extras:{},closed:false});}
function progress(loc){let a=items(loc),c=getLoc(loc).counts;return {done:a.filter(x=>c[x.id]).length,total:a.length,closed:getLoc(loc).closed};}
function statusArticle(loc,p){return getLoc(loc).counts[p.id];}
function go(s){screen=s;render();}
function header(){return `<div class="hrow"><div class="brand"><img src="icon-192.png" alt=""><div><b>INVENTA</b><small>Demo operario · v0.15</small></div></div><div class="topbuttons"><span class="pill">SOLO PRUEBA</span>${data.worker?'<button class="tinybtn" onclick="showModal(\'menu\')">☰</button>':''}</div></div>`}
function render(){let counter=screen==='count';$('app').classList.toggle('counter',counter);$('head').innerHTML=header();$('overlay').innerHTML='';if(screen==='login')renderLogin();else if(screen==='locations')renderLocations();else if(screen==='verify')renderVerify();else if(screen==='articles')renderArticles();else if(screen==='count')renderCount();else if(screen==='review')renderReview();else if(screen==='discrepancy')renderWarning();else if(screen==='closed')renderClosed();else renderLocations();}
function place(html,foot=''){$('content').innerHTML=html;$('foot').innerHTML=foot;}
function renderLogin(){place(`<div class="title"><div class="overline">IDENTIFICACIÓN</div><h1>Empezar inventario</h1><p class="muted">Selecciona tu usuario y escribe tu PIN de demostración.</p></div><div class="card"><div class="field"><label for="worker">Operario</label><select class="input" id="worker"><option value="Operario 1">Operario 1</option><option value="Operario 2">Operario 2</option></select></div><div class="field"><label for="pin">PIN de prueba</label><input class="input" id="pin" type="password" inputmode="numeric" placeholder="4 cifras" maxlength="4" autocomplete="off"></div><div class="alert">PIN de la demostración: <b>1234</b>. No es una identificación segura ni conecta con la empresa.</div><button class="btn" onclick="login()">Entrar al inventario →</button><p id="loginError" class="muted" style="margin-top:9px"></p></div><p class="muted">La demo guarda el avance en este dispositivo. No sincroniza con Supabase ni Business Central.</p>`);$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});}
function login(){if($('pin').value!=='1234'){$('loginError').textContent='PIN incorrecto. Usa el PIN de demostración.';return;}data.worker=$('worker').value;save();go('locations');}
function renderLocations(){const locs=Object.keys(TEST);const done=locs.filter(l=>getLoc(l).closed).length;place(`<div class="title"><div class="overline">TUS UBICACIONES ASIGNADAS</div><h1>Hola, ${esc(data.worker)}</h1><p class="muted">Selecciona la ubicación que vas a contar. No verás cantidades teóricas.</p><div class="progress"><div style="width:${Math.round(100*done/locs.length)}%"></div></div><p class="muted" style="margin-top:5px">${done} de ${locs.length} ubicaciones cerradas</p></div>${locs.map(loc=>{const x=progress(loc);return `<button class="item" onclick="openLocation('${loc}')"><span><strong>${loc}</strong><small>${x.closed?'Finalizada':x.done?`${x.done}/${x.total} artículos contados`:'Pendiente de recuento'}</small></span><span class="tag ${x.closed?'ok':x.done?'warn':''}">${x.closed?'✓ Cerrada':x.total?x.total+' artículos':'Sin existencias previstas'}</span><span class="chev">›</span></button>`}).join('')}<div class="alert">Modo demo: los datos se conservan localmente en este dispositivo. Puedes probar incluso sin conexión después de instalarla y abrirla una vez con Internet.</div>`,`<div class="footerrow"><span class="muted">${navigator.onLine?'● Dispositivo conectado':'● Sin conexión · modo local'}</span><button class="back" style="margin-left:auto" onclick="showModal('help')">Ayuda de instalación</button></div>`);}
function openLocation(loc){activeLoc=loc;const d=getLoc(loc);if(d.closed){go('closed')}else if(d.verified){go('articles')}else{verifyValue='';go('verify')}}
function renderVerify(){place(`<div class="title"><div class="overline">PASO 1 · UBICACIÓN</div><h1>${activeLoc}</h1><p class="muted">Comprueba que estás delante de la ubicación correcta. Puedes leer su etiqueta con un escáner que escriba el código, o confirmarla visualmente.</p></div><div class="card"><div class="field"><label for="locationBarcode">Código de ubicación</label><input class="input" id="locationBarcode" autocapitalize="characters" autocomplete="off" placeholder="${activeLoc}" value="${esc(verifyValue)}"></div><button class="btn" onclick="confirmLocation(false)">Verificar código →</button><div style="height:11px"></div><button class="btn btn-light" onclick="confirmLocation(true)">Confirmar visualmente</button><p id="verifyError" class="muted" style="margin-top:9px"></p></div>`,`<button class="back" onclick="go('locations')">← Mis ubicaciones</button>`);$('locationBarcode').addEventListener('keydown',e=>{if(e.key==='Enter')confirmLocation(false)});}
function confirmLocation(manual){if(!manual&&$('locationBarcode').value.trim().toUpperCase()!==activeLoc){$('verifyError').textContent='El código no coincide con '+activeLoc+'. Revisa la ubicación.';return;}const d=getLoc(activeLoc);d.verified=true;data.events.push({what:'Ubicación confirmada',loc:activeLoc,mode:manual?'visual':'código',at:new Date().toISOString()});save();go('articles');}
function renderArticles(){const d=getLoc(activeLoc),a=items(activeLoc),p=progress(activeLoc);place(`<div class="title"><div class="overline">PASO 2 · ARTÍCULOS</div><div class="between"><h1>${activeLoc}</h1><span class="tag ${p.done===p.total?'ok':''}">${p.done}/${p.total} contados</span></div><p class="muted">Pulsa un artículo o busca su código. Sin cantidades teóricas.</p></div><div class="field"><input class="input" id="articleSearch" placeholder="Buscar por código o nombre" oninput="filterArticles(this.value)"></div><div id="articleList"></div><div class="card"><button class="btn-outline" style="width:100%" onclick="showModal('unexpected')">+ Artículo que no aparece en la lista</button></div>${a.length===0?'<div class="alert">No hay artículos previstos. Si la ubicación está realmente vacía, puedes confirmarlo abajo.</div>':''}`,`<div class="stack"><button class="btn" onclick="closeLocation()">${a.length===0?'Confirmar ubicación vacía':'Finalizar ubicación'}</button><button class="back" onclick="go('locations')">← Volver a ubicaciones</button></div>`);filterArticles('');}
function filterArticles(query){const a=items(activeLoc).filter(p=>(p.id+' '+p.name).toLowerCase().includes(String(query).toLowerCase()));$('articleList').innerHTML=a.length?a.map(p=>{const s=statusArticle(activeLoc,p);return `<button class="item" onclick="openArticle('${esc(p.id)}')"><span><strong style="font-size:14px">${esc(p.name)}</strong><small>${esc(p.id)}${p.extra?' · Artículo añadido':''}</small></span><span class="tag ${s?'ok':''}">${s?(s.notFound?'No encontrado':'✓ Contado'):'Pendiente'}</span><span class="chev">›</span></button>`}).join(''):'<div class="alert">No se han encontrado artículos con ese texto.</div>';}
function openArticle(id){activeArticle=id;pendingResult=null;const rec=getLoc(activeLoc).counts[id];pendingEntries=rec&&!rec.notFound?rec.entries.map(x=>({...x})):[];cMode='direct';cStep=0;cInput='';cParts=[0,0,0];go('count');}
function getProduct(){return items(activeLoc).find(p=>p.id===activeArticle)}
function countTotal(){return pendingEntries.reduce((sum,e)=>sum+e.amount,0)}
function renderCount(){const p=getProduct();const rec=getLoc(activeLoc).counts[p.id];place(`<div class="cproduct"><span>${esc(activeLoc)} · ${esc(p.id)}</span><b>${esc(p.name)}</b></div><div class="modebar"><button id="modeDirect" onclick="setMode('direct')">+ CANTIDAD</button><button id="modePallet" onclick="setMode('pallet')">▦ PALÉ / CAJAS</button></div><div class="between" style="margin-bottom:7px"><span class="muted" id="cStep" style="color:#b9cadd"></span><span id="cProgress" class="tag"></span></div><div class="display"><div class="caption"><span id="cCaption">Cantidad directa</span><span>BOTELLAS</span></div><div class="digits" id="cDigits">0</div><div class="desc" id="cDesc"></div></div><div class="keypad"><button onclick="digit('1')">1</button><button onclick="digit('2')">2</button><button onclick="digit('3')">3</button><button onclick="digit('4')">4</button><button onclick="digit('5')">5</button><button onclick="digit('6')">6</button><button onclick="digit('7')">7</button><button onclick="digit('8')">8</button><button onclick="digit('9')">9</button><button class="ctl" onclick="clearDigit()">BORRAR</button><button onclick="digit('0')">0</button><button class="ctl" onclick="backDigit()">⌫</button></div><button id="cAction" class="addbtn" onclick="actionDigit()">+ AÑADIR AL TOTAL</button><div class="c-tools"><span id="cEntries">0 apuntes</span><button onclick="showModal('history')">VER / CORREGIR ›</button></div>`,`<div class="counter-total"><span>TOTAL ACUMULADO</span><strong><span id="liveTotal">${fmt(countTotal())}</span> <span style="font-size:11px">ud.</span></strong></div><div class="counter-footer"><button onclick="go('articles')">← Artículos</button><button onclick="undoEntry()">↶ Deshacer</button><button onclick="prepareReview()">REVISAR Y GUARDAR →</button></div>`);drawCount();}
function setMode(v){cMode=v;cStep=0;cInput='';cParts=[0,0,0];drawCount();}
function digit(n){if(cInput.length>=8)return;cInput=(cInput+n).replace(/^0+(?=\d)/,'');if(cInput==='0')cInput='';drawCount();}
function clearDigit(){cInput='';drawCount()};function backDigit(){cInput=cInput.slice(0,-1);drawCount()};
function drawCount(){if(screen!=='count')return;const n=valid(cInput)?Number(cInput):0;const lab=['Cajas por base','Número de alturas','Botellas por caja'];$('modeDirect').classList.toggle('on',cMode==='direct');$('modePallet').classList.toggle('on',cMode==='pallet');$('cDigits').textContent=cInput||'0';$('cCaption').textContent=cMode==='direct'?'Botellas contadas':lab[cStep];$('cStep').textContent=cMode==='direct'?'Introduce una cantidad suelta':'Palé · paso '+(cStep+1)+' de 3';$('cProgress').textContent=cMode==='direct'?'DIRECTO':(cStep+1)+'/3';$('cDesc').textContent=cMode==='direct'?'Cada añadido se suma al total.':cStep===0?'Indica las cajas por base.':cStep===1?'Base: '+cParts[0]+' cajas.':`${cParts[0]} × ${cParts[1]} × ${n||'…'} = ${n?fmt(cParts[0]*cParts[1]*n):'…'} botellas`;$('cAction').textContent=cMode==='direct'?'+ AÑADIR CANTIDAD':cStep<2?'SIGUIENTE ›':'+ SUMAR PALÉ AL TOTAL';$('cAction').disabled=!n||(cMode==='pallet'&&cStep===2&&(!Number.isSafeInteger(cParts[0]*cParts[1]*n)||cParts[0]*cParts[1]*n>99999999));$('cEntries').textContent=pendingEntries.length+' '+(pendingEntries.length===1?'apunte':'apuntes')+' realizados';$('liveTotal').textContent=fmt(countTotal());}
function actionDigit(){if(!valid(cInput))return;const n=Number(cInput);if(cMode==='direct'){pendingEntries.push({kind:'directa',detail:`${n} botellas`,amount:n});cInput='';}else{cParts[cStep]=n;if(cStep<2){cStep++;cInput='';}else{const amount=cParts[0]*cParts[1]*cParts[2];if(!Number.isSafeInteger(amount)||amount>99999999)return;pendingEntries.push({kind:'palé',detail:cParts.join(' × '),amount});cStep=0;cInput='';cParts=[0,0,0];}}drawCount();}
function undoEntry(){if(pendingEntries.length)pendingEntries.pop();drawCount();}
function prepareReview(){if(countTotal()===0){showModal('emptycount');return;}pendingResult='counted';go('review');}
function renderReview(){const p=getProduct();place(`<div class="title"><div class="overline">PASO 4 · REVISIÓN</div><h1>Confirmar recuento</h1><p class="muted">${esc(activeLoc)} · ${esc(p.name)}</p></div><div class="card" style="text-align:center"><div class="overline">TOTAL CONTADO</div><div style="font-size:48px;font-weight:950;color:#142f4f">${fmt(countTotal())}</div><div class="muted">botellas · ${pendingEntries.length} apuntes</div></div><div class="card"><h2>Detalle</h2>${pendingEntries.map(e=>`<div class="between" style="border-bottom:1px solid #edf0f5;padding:8px 0"><span class="muted">${esc(e.kind)}: ${esc(e.detail)}</span><b>+${fmt(e.amount)}</b></div>`).join('')}</div><div class="alert">Al guardar, INVENTA comprobará si la desviación supera la tolerancia de aviso. El operario no verá la cantidad teórica.</div>`,`<div class="stack"><button class="btn" onclick="validateCount()">Guardar recuento →</button><button class="back" onclick="go('count')">← Modificar cantidades</button></div>`);}
const tolerance=expected=>Math.max(2,Math.floor(expected*.05));
function validateCount(){const p=getProduct(),amount=countTotal(),diff=Math.abs(amount-p.theoretical);pendingResult='counted';if(diff>tolerance(p.theoretical)){go('discrepancy');}else{commitCount(false);}}
function renderWarning(){const p=getProduct();place(`<div class="title"><div class="overline">COMPROBACIÓN AUTOMÁTICA</div><h1>⚠️ Revisa tu recuento</h1><p class="muted">${esc(p.name)}</p></div><div class="alert red"><b>Atención:</b> la cantidad introducida presenta una diferencia superior a la tolerancia configurada. Puede haber un error de conteo.</div><div class="card" style="text-align:center"><div class="overline">HAS CONTADO</div><div style="font-size:48px;font-weight:950">${fmt(countTotal())}</div><span class="muted">botellas</span></div><p class="muted">Vuelve a comprobar la mercancía. Si estás seguro del recuento, puedes confirmarlo. El responsable revisará la diferencia.</p>`,`<div class="stack"><button class="btn" onclick="go('count')">Volver a contar</button><button class="btn-outline" onclick="commitCount(true)">Confirmar esta cantidad</button></div>`);}
function commitCount(warning,notFound=false){const rec={entries:pendingEntries.map(x=>({...x})),amount:notFound?0:countTotal(),notFound:!!notFound,warning:!!warning,at:new Date().toISOString()};const p=getProduct();getLoc(activeLoc).counts[activeArticle]=rec;data.events.push({what:notFound?'No encontrado':'Artículo contado',loc:activeLoc,article:activeArticle,amount:rec.amount,warning:rec.warning,at:rec.at});save();pendingEntries=[];go('articles');}
function markNotFound(){pendingEntries=[];cInput='';const p=getProduct();if(!confirm(`Confirmar que no se ha encontrado ${p.name} en ${activeLoc}?`))return;const warn=p.theoretical>tolerance(p.theoretical);commitCount(warn,true);}
function closeLocation(){const p=progress(activeLoc);if(p.done!==p.total){showModal('missing');return;}const d=getLoc(activeLoc);d.closed=true;data.events.push({what:'Ubicación cerrada',loc:activeLoc,at:new Date().toISOString()});save();go('closed');}
function renderClosed(){const p=progress(activeLoc);place(`<div class="card" style="text-align:center;padding:25px 15px"><div class="bigcheck">✅</div><h1 style="margin:9px 0">Ubicación finalizada</h1><h2>${activeLoc}</h2><p class="muted" style="margin-top:7px">${p.done} artículos revisados. La información permanece en esta demo local y NO se ha sincronizado.</p></div><div class="alert">En la app real el responsable tendrá que autorizar cualquier reapertura y revisar todas las diferencias, incluso las inferiores a la tolerancia.</div>`,`<button class="btn" onclick="go('locations')">Ir a otra ubicación →</button>`);}
function showModal(m){modal=m;let body='';if(m==='history'){body=`<h2>Detalle del recuento</h2>${pendingEntries.length?pendingEntries.map((e,i)=>`<div class="line"><span>${esc(e.detail)}<br><b>+${fmt(e.amount)}</b></span><button onclick="removeEntry(${i})">Eliminar</button></div>`).join(''):'<p class="muted">Sin cantidades añadidas.</p>'}<div class="modal-actions"><button class="btn-outline" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='menu'){body=`<h2>Opciones de prueba</h2><p class="muted">Usuario: ${esc(data.worker)}. Los recuentos se guardan en este dispositivo.</p><div class="stack" style="margin-top:12px"><button class="btn-outline" onclick="installHelp()">Cómo instalar INVENTA</button><button class="btn-outline" onclick="resetDemo()">Restablecer datos de prueba</button><button class="btn-outline" onclick="logout()">Cambiar operario</button><button class="btn" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='help'){body=`<h2>Instalar INVENTA</h2><p class="muted">En iPhone: abre esta dirección desde Safari, pulsa Compartir y elige <b>Añadir a pantalla de inicio</b>. Después abre el icono INVENTA. En Android: menú de Chrome → Instalar aplicación.</p><p class="muted" style="margin-top:10px">Los archivos básicos se guardan tras la primera carga. Los datos de prueba son solo locales.</p><button class="btn" style="margin-top:12px" onclick="hideModal()">Entendido</button>`;}else if(m==='unexpected'){body=`<h2>Artículo no listado</h2><p class="muted">Registra provisionalmente un artículo encontrado en ${activeLoc}. En la aplicación definitiva se comunicará una incidencia al responsable.</p><div class="field" style="margin-top:11px"><label for="unknownCode">Código de artículo</label><input class="input" id="unknownCode" placeholder="Ej. PRD0009999"></div><div class="field"><label for="unknownName">Descripción (opcional)</label><input class="input" id="unknownName" placeholder="Artículo encontrado"></div><button class="btn" onclick="addUnexpected()">Añadir a esta ubicación</button><button class="back" onclick="hideModal()">Cancelar</button><p id="modalError" class="muted"></p>`;}else if(m==='missing'){const rem=items(activeLoc).filter(p=>!getLoc(activeLoc).counts[p.id]).length;body=`<h2>Quedan artículos sin revisar</h2><p class="muted">Debes contar o marcar «No encontrado» en ${rem} artículo(s) antes de cerrar ${activeLoc}.</p><button class="btn" style="margin-top:11px" onclick="hideModal()">Seguir contando</button>`;}else if(m==='emptycount'){body=`<h2>Sin cantidades</h2><p class="muted">Todavía no hay unidades apuntadas. Si el producto no está en esta ubicación, utiliza «No encontrado».</p><button class="btn" style="margin-top:10px" onclick="markNotFound()">No encontrado</button><button class="btn-outline" style="width:100%;margin-top:8px" onclick="hideModal()">Seguir contando</button>`;}
$('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)hideModal()"><div class="modal">${body}</div></div>`;}
function hideModal(){$('overlay').innerHTML='';modal='';}
function removeEntry(i){pendingEntries.splice(i,1);hideModal();renderCount();showModal('history');}
function addUnexpected(){const code=$('unknownCode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,28);if(!code){$('modalError').textContent='Introduce un código.';return;}if(items(activeLoc).some(p=>p.id===code)){$('modalError').textContent='Ese artículo ya existe en la ubicación.';return;}const name=$('unknownName').value.trim().slice(0,90);getLoc(activeLoc).extras[code]={name:name||'Artículo encontrado no previsto'};data.events.push({what:'Artículo provisional',loc:activeLoc,article:code,at:new Date().toISOString()});save();hideModal();go('articles');}
function installHelp(){hideModal();showModal('help')}
function logout(){data.worker='';save();hideModal();go('login')}
function resetDemo(){if(!confirm('¿Borrar todos los recuentos de esta DEMO en este dispositivo?'))return;data=blank();save();hideModal();go('login')}
window.addEventListener('online',()=>{if(screen==='locations')render()});window.addEventListener('offline',()=>{if(screen==='locations')render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
render();
</script></body></html>
