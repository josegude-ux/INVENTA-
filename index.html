<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST={
 'K00-P01':[{id:'PRD0003563',name:"GINEBRA SEAGRAM'S 70 CL",theoretical:200},{id:'PRD0001287',name:'RON AÑEJO 70 CL',theoretical:30}],
 'K00-P02':[{id:'PRD0002411',name:'REFRESCO LIMÓN 33 CL',theoretical:72},{id:'PRD0001572',name:'AGUA MINERAL 50 CL',theoretical:24}],
 'K00-P03':[],
 'L00-P01':[{id:'PRD0006051',name:'ZUMO NARANJA 1 L',theoretical:60}],
 'L00-P02':[{id:'PRD0008812',name:'GALLETAS SURTIDAS',theoretical:36}],
 'M00-P01':[{id:'PRD0004012',name:'LECHE ENTERA 1 L',theoretical:48}]};
const AISLES={'Operario 1':['K','L'],'Operario 2':['K','M']};
const APP_VERSION='0.30.14';
const KEY='inventa-demo-operario-v015';
// Conserva asociaciones de códigos entre versiones y recuentos de prueba.
const DRAFT_KEY='inventa-demo-draft-v020:';
const blank=()=>({version:1,worker:'',countSession:null,locations:{},events:[]});
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.version===1&&p.locations){if(p.demoInventoryOpen===undefined)p.demoInventoryOpen=!!p.countSession;return p;}}catch(e){}return blank();}
let data=load(),screen='home',activeAisle='',activeLoc='',activeArticle='',cMode='direct',cStep=0,cInput='',cParts=[0,0,0,0],pendingEntries=[],pendingResult=null,modal='',verifyValue='',countFeedback='',savedFeedback='',locationFilter='all',lastPallet=null,repeatMode=false,overwriteInput=false,resumedDraft=false,editReason='',editOriginal=null,editReasonChoice='',editReasonNote='',editingIndex=-1,entryEdits=[];
let consultUser='',managerUser='';
const fmt=n=>Number(n).toLocaleString('es-ES');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid=s=>/^\d{1,8}$/.test(String(s))&&Number(s)>0&&Number.isSafeInteger(Number(s));
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
// La modalidad se mantiene por jornada hasta realizar un relevo explícito.
function sessionWorkers(){
 const crew=data.countSession?.workers;
 return Array.isArray(crew)&&crew.length&&crew[0]===data.worker?[...new Set(crew.filter(Boolean))]:data.worker?[data.worker]:[];
}
function sessionMode(){return sessionWorkers().length===2?'pair':'single';}
function sessionLabel(){return sessionMode()==='pair'?'Pareja: '+sessionWorkers().join(' + '):'Individual: '+(data.worker||'sin identificar');}
function sessionAudit(){return {workers:sessionWorkers(),countMode:sessionMode()};}
function renderSession(){
 const colleague=Object.keys(AISLES).filter(w=>w!==data.worker);
 place(`<div class="vis-title"><h1>¿Cómo vais a contar?</h1><p class="vis-help">MODALIDAD DE RECUENTO · DEMO · Esta selección se mantiene entre ubicaciones. En la versión definitiva la asignará el supervisor.</p></div>
 <div class="vis-card"><h2><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-user-round"/></svg> Recuento individual</h2><p class="vis-help">${esc(data.worker)} cuenta y registra las cantidades.</p><button class="vis-button-secondary" onclick="startSession('single')">Empezar individual <svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-right"/></svg></button></div>
 <div class="vis-card"><h2><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-users"/></svg> Recuento en pareja</h2><p class="vis-help">Dos personas cuentan juntas y utilizan un único móvil; se guarda un solo resultado con ambos nombres.</p>
 <div class="vis-field"><label for="sessionPartner">Segundo operario</label><select class="vis-control" id="sessionPartner">${colleague.map(w=>'<option value="'+esc(w)+'">'+esc(w)+'</option>').join('')}</select></div>
 <div class="vis-field"><label for="partnerPin">PIN del segundo operario (solo demo)</label><input class="vis-control" id="partnerPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 cifras"></div>
 <button class="vis-button-primary" onclick="startSession('pair')">Empezar en pareja <svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-right"/></svg></button></div>
 <div class="vis-notice inventory-notice">Esta versión funciona localmente y utiliza el PIN 1234 de prueba. No autentica realmente al segundo operario ni asigna permisos de supervisor.</div><p id="sessionError" class="vis-help" role="alert"></p>`,
 '<button class="back" onclick="logout()"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-left"/></svg> Cambiar usuario principal</button>');
}
function startSession(mode){
 if(!data.worker||!['single','pair'].includes(mode))return;
 let workers=[data.worker];
 if(mode==='pair'){
  const partner=$('sessionPartner')?.value;
  if(!partner||partner===data.worker||!Object.prototype.hasOwnProperty.call(AISLES,partner)){$('sessionError').textContent='Selecciona otro operario.';return;}
  if($('partnerPin')?.value!=='1234'){$('sessionError').textContent='PIN del segundo operario incorrecto (demo: 1234).';return;}
  workers.push(partner);
 }
 const previous=data.countSession;
 data.countSession={mode,workers,startedAt:new Date().toISOString()};data.demoInventoryOpen=true;
 data.events.push({what:previous?'Cambio de equipo de recuento':'Inicio de equipo de recuento',oldWorkers:previous?.workers||[],...sessionAudit(),worker:data.worker,at:data.countSession.startedAt});
 save();go('aisles');
}
function changeSession(){
 hideModal();
 if(countingInProgress()||readDraft(data.worker)){alert('Termina de guardar o descarta el recuento en curso antes de cambiar de equipo.');return;}
 go('session');
}
function items(loc){let base=(TEST[loc]||[]).map(p=>({...p}));let unexpected=Object.entries(data.locations[loc]?.extras||{}).map(([id,v])=>({id,name:v.name||'Artículo encontrado no previsto',theoretical:0,extra:true}));return [...base,...unexpected];}
function getLoc(loc){const d=data.locations[loc]||(data.locations[loc]={verified:false,counts:{},extras:{},closed:false,incidents:{}});if(!d.incidents)d.incidents={};return d;}
function draftKey(worker){return DRAFT_KEY+encodeURIComponent(worker);}
function readDraft(worker){
 if(!worker)return null;
 try{
  const d=JSON.parse(localStorage.getItem(draftKey(worker)));
  if(!d||d.version!==2||d.worker!==worker||!(AISLES[worker]||[]).includes(d.loc.slice(0,1)))return null;
  if(!items(d.loc).some(p=>p.id===d.article)||getLoc(d.loc).closed)return null;
  if(!['count','review','discrepancy','edit-detail'].includes(d.screen))return null;
  if(!Array.isArray(d.entries)||d.entries.some(e=>!Number.isSafeInteger(e.amount)||e.amount<=0))return null;
  return d;
 }catch(e){return null;}
}
function clearDraft(worker=data.worker){try{localStorage.removeItem(draftKey(worker));}catch(e){}}
function saveDraft(){
 if(!data.worker||!activeLoc||!activeArticle||!['count','review','discrepancy','edit-detail'].includes(screen))return;
 const d={version:2,worker:data.worker,loc:activeLoc,article:activeArticle,screen,
  entries:pendingEntries.map(e=>({...e})),mode:cMode,step:cStep,input:cInput,
  parts:[...cParts],lastPallet:lastPallet?[...lastPallet]:null,
  repeatMode,overwriteInput,editReason,editOriginal,editReasonChoice,editReasonNote,entryEdits:entryEdits.map(x=>({...x})),feedback:countFeedback,at:new Date().toISOString()};
 try{localStorage.setItem(draftKey(data.worker),JSON.stringify(d));return true;}catch(e){return false;}
}
function restoreDraft(d){
 activeLoc=d.loc;activeAisle=aisleFor(d.loc);activeArticle=d.article;
 pendingEntries=d.entries.map(e=>({...e}));cMode=d.mode==='pallet'?'pallet':'direct';
 cStep=Math.min(3,Math.max(0,Number(d.step)||0));
 cInput=/^\d{0,8}$/.test(String(d.input||''))?String(d.input||''):'';
 cParts=Array.isArray(d.parts)&&d.parts.length===4?d.parts.map(n=>Number(n)||0):[0,0,0,0];
 lastPallet=Array.isArray(d.lastPallet)&&d.lastPallet.length===4?d.lastPallet.map(Number):null;
 repeatMode=!!d.repeatMode&&!!lastPallet;overwriteInput=!!d.overwriteInput;editReason=String(d.editReason||'');editOriginal=d.editOriginal??null;editReasonChoice=String(d.editReasonChoice||'');editReasonNote=String(d.editReasonNote||'');entryEdits=Array.isArray(d.entryEdits)?d.entryEdits.map(x=>({...x})):[];editingIndex=-1;
 countFeedback=d.feedback||'Recuento recuperado automáticamente. Todavía sin guardar.';
 screen=d.screen;resumedDraft=true;
}
function bestPreviousPallet(entries){
 const e=[...entries].reverse().find(x=>Array.isArray(x.factors)&&x.factors.length===4&&x.factors.every(n=>Number.isSafeInteger(n)&&n>0));
 return e?e.factors.slice():null;
}
function hasDifference(p,rec){return !!rec && (rec.amount!==p.theoretical || !!rec.warning || !!rec.notFound);}
function isCountVerified(loc,p){const d=getLoc(loc),rec=d.counts[p.id];return !!rec && !d.incidents[p.id] && !hasDifference(p,rec);}
function hasLocationIssue(loc,p){const d=getLoc(loc);return !!d.incidents[p.id] || hasDifference(p,d.counts[p.id]) || (!!p.extra && !isCountVerified(loc,p));}
function progress(loc){
 const a=items(loc),d=getLoc(loc);
 const done=a.filter(p=>isCountVerified(loc,p)).length;
 const flagged=a.some(p=>hasLocationIssue(loc,p));
 return {done,total:a.length,closed:d.closed,flagged,complete:d.closed||(a.length>0&&done===a.length&&!flagged),partial:done>0&&done<a.length};
}

function aisleFor(loc){return loc.slice(0,1).toUpperCase();}
function aisleLocations(aisle){return Object.keys(TEST).filter(loc=>aisleFor(loc)===aisle);}
function assignedAisles(){return AISLES[data.worker]||[];}
function openAisle(aisle){if(!assignedAisles().includes(aisle))return;activeAisle=aisle;locationFilter='all';go('locations');}
function setLocationFilter(v){locationFilter=v;renderLocations();}
function statusLabel(p){if(p.flagged)return '⚠ Revisar';if(p.complete)return '✓';if(p.partial)return 'En curso';return 'Pendiente';}

function statusArticle(loc,p){return getLoc(loc).counts[p.id];}
function incidentArticle(loc,p){return getLoc(loc).incidents[p.id];}
let updateReady=false, updating=false, lastCheck=0, hadController=false, bootAt=Date.now(), reloadedForUpdate=false;
function countingInProgress(){return ['count','review','discrepancy','edit-detail'].includes(screen)||!!scanMode;}
function showPendingUpdate(){
 const el=$('updateBanner');if(!el)return;
 if(!updateReady){el.hidden=true;return;}
 el.hidden=false;el.innerHTML='<div class="update-msg"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-refresh-cw"/></svg> Actualización lista para instalar.<br>'+ (countingInProgress()?'Termina de guardar el artículo antes de actualizar.':'Puedes actualizar INVENTA ahora.')+'</div><button class="vis-button-primary" onclick="applyInventaUpdate()">'+ (countingInProgress()?'Después':'Actualizar')+'</button>';
}
function forceUpdateInventa(){
 if(countingInProgress()){alert('Termina de guardar el artículo antes de actualizar. No se perderán los recuentos guardados.');return;}
 // Query strings are not present in earlier offline caches. The installed PWA fetches a fresh index.
 const url=new URL('./',location.href);
 url.searchParams.set('actualizar','v'+APP_VERSION+'-'+Date.now());
 window.location.replace(url.href);
}
function applyInventaUpdate(){
 if(countingInProgress()){alert('Guarda o cancela el recuento del artículo antes de actualizar, para no perder cantidades.');return;}
 window.location.reload();
}
function informUpdate(){updateReady=true;if(!countingInProgress()&&Date.now()-bootAt<12000&&!reloadedForUpdate){reloadedForUpdate=true;location.reload();return;}showPendingUpdate();}
async function checkForUpdates(manual=false){
 if(!('serviceWorker' in navigator)){if(manual)alert('No se pueden comprobar actualizaciones en este navegador.');return;}
 if(updating)return;updating=true;
 try{
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg){if(manual)alert('El servicio de actualización aún no está instalado. Cierra y abre INVENTA.');return;}
  await reg.update();lastCheck=Date.now();
  if(reg.waiting&&navigator.serviceWorker.controller){informUpdate();}
  else if(manual&&reg.installing){alert('Se ha detectado una actualización. Se está descargando; aparecerá un aviso cuando esté lista.');}
  else if(manual&&updateReady){showPendingUpdate();}
  else if(manual){alert('INVENTA v'+APP_VERSION+' está actualizada.');}
 }catch(e){if(manual)alert('No se ha podido comprobar la actualización. Revisa la conexión a Internet.');}
 finally{updating=false;}
}
function initInventaUpdates(){
 if(!('serviceWorker' in navigator))return;
 hadController=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)informUpdate();hadController=true;});
 navigator.serviceWorker.register('./service-worker.js').then(reg=>{
   if(reg.waiting&&navigator.serviceWorker.controller)informUpdate();
   const watch=sw=>{if(sw)sw.addEventListener('statechange',()=>{if(sw.state==='installed'&&navigator.serviceWorker.controller)informUpdate();});};
   reg.addEventListener('updatefound',()=>watch(reg.installing));
   checkForUpdates(false);
 }).catch(()=>{});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>60000)checkForUpdates(false);});
}
function go(s){screen=s;render();if(s==='review'||s==='discrepancy'||s==='edit-detail')saveDraft();showPendingUpdate();}
function settingsButton(){return '<button type="button" class="settings-button" onclick="openSettings()" aria-label="Ajustes"><svg class="vis-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-settings"/></svg><span>Ajustes</span></button>';}
function openSettings(){
 const allowed=homePermissions(),profile=window.INVENTA_MGMT?.profile;
 const homeContext=screen==='home',realContext=!!$('head').querySelector('.real-interior-bar');
 const roleLabel={operator:'Operario',supervisor:'Supervisor',admin:'Administrador'}[allowed.role]||'';
 const version=(homeContext&&!realContext?'Entorno piloto · v':'INVENTA · v')+APP_VERSION;
 $('overlay').innerHTML='<div class="modalback settings-backdrop"><section class="compact-settings vis-card vis-stack" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">'
 +'<div class="settings-heading vis-title"><div><h2 id="settingsTitle">Ajustes</h2><p>'+version+'</p></div><button type="button" class="vis-icon-button vis-icon-button--bare" onclick="hideModal()" aria-label="Cerrar ajustes">'+homeIcon('close')+'</button></div>'
 +'<section class="settings-section"><h3>Cuenta</h3>'+(allowed.authenticated?'<p>'+esc(profile?.display_name||(homeContext?'Usuario':''))+' · '+esc(roleLabel)+'</p>':'<p class="vis-help">Accede con tu cuenta para ver tus funciones.</p>')+'</section>'
 +'<section class="settings-section"><h3>Aplicación</h3><p class="vis-help">Tema: según la configuración del sistema.</p><div class="settings-actions">'+installMarkup(!homeContext)+'<button type="button" class="vis-button-secondary" onclick="hideModal();safeNavigation(()=>checkForUpdates(true))">'+homeIcon('refresh-cw')+' Buscar actualizaciones</button></div></section>'
 +(allowed.management&&$('bcLiveStatus')?'<section class="settings-section"><h3>Estado de datos BC</h3><p class="vis-help" id="compactBCDetails" role="status"></p></section>':'')
 +(screen==='management'&&allowed.management?'<section class="settings-section"><h3>Conexión</h3><p class="vis-help">Conectado a INVENTA · Supabase</p><p class="vis-help">No se modifica Business Central automáticamente. Los datos locales de la demo no se envían al servidor.</p></section>':'')
 +(homeContext&&allowed.demo?'<section class="settings-section"><h3>Demostración</h3><button type="button" class="vis-button-secondary" onclick="hideModal();safeNavigation(()=>go(\'demo-home\'))">Zona de demostración</button><p class="vis-help">Recuentos reales individuales. Las pruebas de pareja y escáner están en la zona de demostración.</p></section>':'')
 +((data.worker&&!allowed.authenticated)?'<section class="settings-section"><h3>Demostración</h3><button type="button" class="vis-button-secondary" onclick="showModal(\'menu\')">Opciones de demostración</button></section>':'')
 +(allowed.authenticated?'<button type="button" class="vis-button-secondary compact-logout" onclick="safeNavigation(()=>{hideModal();logoutManager();})">Cerrar sesión</button>':'')+'</section></div>';
 if(homeContext)updateHomeBCPresentation();$('settingsTitle').setAttribute('tabindex','-1');$('settingsTitle').focus();
}
function header(){const counting=!['home','manager-login','management','consult-login','consult'].includes(screen);return `<div class="hrow"><div class="brand"><div><button class="brand-home" type="button" onclick="navigateHome()" aria-label="INVENTA: ir al menú principal"><img class="brand-wordmark" src="assets/brand/inventa-logo.svg" alt="INVENTA" width="496" height="80"></button><small>${window.INVENTA_MGMT?.isAuthenticated()&&!window.INVENTA_CONSULT_DEMO?'INVENTA':'Demo'} · v${APP_VERSION}${counting&&data.worker&&data.countSession?' · '+esc(sessionLabel()):screen==='consult'?' · Consulta':screen==='management'?' · Gestión almacén':''}</small></div></div><div class="topbuttons">${settingsButton()}</div></div>`;}
function render(){let counter=screen==='count';$('app').classList.toggle('landing',screen==='home');$('app').classList.toggle('counter',counter);$('head').innerHTML=header();$('overlay').innerHTML='';if(screen==='home')renderHome();else if(screen==='demo-home')renderDemoHome();else if(screen==='manager-login')renderManagerLogin();else if(screen==='management')renderManagement();else if(screen==='consult-login')renderConsultLogin();else if(screen==='consult')renderConsult();else if(screen==='login')renderLogin();else if(screen==='session')renderSession();else if(screen==='aisles')renderAisles();else if(screen==='locations')renderLocations();else if(screen==='verify')renderVerify();else if(screen==='articles')renderArticles();else if(screen==='edit-detail')renderEditDetail();else if(screen==='count')renderCount();else if(screen==='review')renderReview();else if(screen==='discrepancy')renderWarning();else if(screen==='location-review')renderLocationReview();else if(screen==='closed')renderClosed();else renderHome();}
let navigationBaseline=[];
function navigationFields(){return Array.from(document.querySelectorAll('#content input,#content select,#content textarea')).filter(el=>!['consultSearch','catalogSearch'].includes(el.id));}
function navigationDirty(){return navigationBaseline.some(([el,value])=>el.isConnected&&(el.type==='checkbox'?el.checked:el.value)!==value);}
function navigationBusy(){return !!(window.INVENTA_MGMT?.isSaving?.()||window.INVENTA_REAL?.isBusy?.());}
function safeNavigation(action){
 if(navigationBusy()){alert('Hay un guardado o una sincronización en curso. Espera a que termine y vuelve a pulsar.');return false;}
 if(navigationDirty()&&!confirm('Hay cambios sin guardar. Pulsa Cancelar para quedarte y guardarlos, o Aceptar para descartarlos y salir.'))return false;
 action();return true;
}
function navigateHome(){

function openScanner(mode){
 if(!['location','verify','article','consult'].includes(mode))return;
 if(mode==='consult'&&(!consultUser||consultBlocked()))return;
 // No custom permission screen. The button triggers the camera operation.
 stopScanner();scanMode=mode;scanBusy=false;scanUnknownCode='';
 $('scanOverlay').hidden=false;$('scanUnknown').hidden=true;
 $('scanTitle').textContent=mode==='location'?'Escanear ubicación':mode==='verify'?'Verificar ubicación':mode==='consult'?'Escanear para consultar':'Escanear artículo';
 $('scanManual').value='';$('scanReader').innerHTML='';
 updateScanStatus('Abriendo cámara tras pulsar Escanear…');
 startScanner(scanActive);
}
async function startScanner(token){
 if(token!==scanActive||!scanMode)return;
 if(!navigator.mediaDevices?.getUserMedia){
  updateScanStatus('Este navegador no permite abrir la cámara desde INVENTA. Escribe el código manualmente.');
  return;
 }
 try{
  const Scanner=await loadScanLibrary();if(token!==scanActive||!scanMode)return;
  const formatNames=['QR_CODE','CODE_128','EAN_13','EAN_8','UPC_A','UPC_E','CODE_39','ITF','DATA_MATRIX','CODABAR'];
  const supported=formatNames.map(n=>window.Html5QrcodeSupportedFormats?.[n]).filter(n=>n!==undefined);
  const config=supported.length?{formatsToSupport:supported,verbose:false}:{verbose:false};
  const instance=new Scanner('scanReader',config);scanReader=instance;
  const onRead=(text)=>{if(token===scanActive&&!scanBusy)handleScanned(text);};
  const options={fps:10,aspectRatio:1.3,disableFlip:true};
  await instance.start({facingMode:'environment'},options,onRead,()=>{});
  if(token!==scanActive){await shutdownScanCamera();return;}
  updateScanStatus('Cámara abierta. Centra el código de barras o QR hasta reconocerlo.');
 }catch(err){if(token===scanActive)updateScanStatus(scannerFailure(err));}
}
function restartScanner(){

}
function submitScanManual(){scanBusy=false;$('scanUnknown').hidden=true;handleScanned($('scanManual').value);}
function handleScanned(raw){
 const code=barcodeKey(raw);
 if(!printableCode(code)){updateScanStatus('Código vacío o no válido. Revisa la etiqueta.');return;}
 if(scanBusy)return;
 scanBusy=true;
 const mode=scanMode;
 if(mode==='consult'){
  const match=window.INVENTA_CONSULT_UI.lookup(code);
  const fallback=!isManager()?codeForArticle(code):null;
  const selected=match||(fallback?{value:fallback,mode:'article'}:null);
  if(!selected){updateScanStatus('Código no encontrado en la consulta.');scanBusy=false;return;}
  window.INVENTA_CONSULT_UI.applyScan(selected);
  stopScanner();go('consult');$('consultSearch').value=selected.value;filterConsult(selected.value);return;
 }
 if(mode==='location'){
  const loc=Object.keys(TEST).find(k=>normCode(k)===code);
  if(!loc){updateScanStatus('La ubicación '+code+' no existe en los datos cargados.');scanBusy=false;return;}
  if(!assignedAisles().includes(aisleFor(loc))){updateScanStatus('Esta ubicación no está asignada al operario.');scanBusy=false;return;}
  stopScanner();activeAisle=aisleFor(loc);openLocation(loc);return;
 }
 if(mode==='verify'){
  if(code!==normCode(activeLoc)){updateScanStatus('Código '+code+' distinto de '+activeLoc+'. No se confirma la ubicación.');scanBusy=false;return;}
  stopScanner();verifyValue=code;const d=getLoc(activeLoc);d.verified=true;
  data.events.push({what:'Ubicación confirmada',loc:activeLoc,mode:'cámara',at:new Date().toISOString()});
  save();go('articles');return;
 }
 if(mode==='article'){
  const article=matchLocalArticle(code);
  if(article){stopScanner();openArticle(article.id);return;}
  scanUnknownCode=code;
  const globalMatch=codeForArticle(code);
  const available=items(activeLoc).filter(p=>!p.extra);
  $('scanUnknownText').textContent=globalMatch?
   'Este código está vinculado al artículo '+globalMatch+', pero no está listado en la ubicación '+activeLoc+'. No se reasignará automáticamente.':
   'Código '+code+' no encontrado. Puedes asociarlo a una referencia de esta ubicación para futuras lecturas.';
  const selector=$('scanLinkArticle');
  selector.innerHTML='<option value="">Selecciona el artículo correcto…</option>'+available.map(p=>
   '<option value="'+esc(p.id)+'">'+esc(p.id)+' · '+esc(p.name)+'</option>').join('');
  selector.disabled=!!globalMatch;
  $('scanUnknown').hidden=false;
  updateScanStatus(globalMatch?'Código conocido en otra ubicación: verifica antes de continuar.':'Código desconocido. Confirma la referencia antes de guardarlo.');
  // Congelamos el primer resultado hasta que el operario lo asocie o pulse Reintentar.
  // De otro modo la cámara vuelve a leer el mismo código y restablece el selector constantemente.
 }
}
function saveScannedAssociation(){
 const raw=scanUnknownCode,key=barcodeKey(raw),id=$('scanLinkArticle').value;
 if(!raw||!id){updateScanStatus('Selecciona el artículo al que pertenece la etiqueta.');return;}
 if(!items(activeLoc).some(p=>p.id===id)){updateScanStatus('Referencia fuera de esta ubicación.');return;}
 const registered=codeForArticle(key);
 if(registered&&registered!==id){updateScanStatus('Conflicto: el código ya corresponde a '+registered+'. No se ha cambiado la relación.');return;}
 const previous=catalog()[key];
 const at=new Date().toISOString();
 catalog()[key]={articleId:id,code:raw,source:'INVENTA',createdAt:previous?.createdAt||at,createdBy:previous?.createdBy||data.worker,updatedAt:at};
 data.events.push({what:'Código asociado',barcode:key,article:id,worker:data.worker,at});

 openArticle(id);
}

async function importBarcodeFile(input){
 const file=input?.files?.[0];if(!file)return;
 input.value='';
 if(file.size>2*1024*1024){alert('Archivo demasiado grande para la base de prueba (máximo 2 MB).');return;}
 try{
  const raw=JSON.parse(await file.text());
  if(raw?.schema!=='INVENTA_BARCODES_V1'||!raw.barcodes||typeof raw.barcodes!=='object'||Array.isArray(raw.barcodes))throw Error('Formato no reconocido');
  const rows=Object.entries(raw.barcodes);if(rows.length>20000)throw Error('Demasiados códigos');
  const known=new Set(Object.values(TEST).flat().map(p=>p.id));
  for(const loc of Object.values(data.locations))for(const id of Object.keys(loc.extras||{}))known.add(id);
  let loaded=0,conflicts=0,unknown=0;
  const pending=[];
  for(const [rawCode,entry] of rows){
    const code=barcodeKey(rawCode),id=String(entry?.articleId||'');
    if(!printableCode(code)||!known.has(id)){unknown++;continue;}
    const prior=codeForArticle(code);
    if(prior&&prior!==id){conflicts++;continue;}
    if(prior===id)continue;
    const at=new Date().toISOString();
    pending.push([code,{articleId:id,code,source:'INVENTA-import',createdAt:entry.createdAt||at,createdBy:entry.createdBy||'Importado',updatedAt:at}]);
  }
  if(!pending.length){alert('Sin asociaciones nuevas. Conflictos: '+conflicts+'; no reconocidas: '+unknown+'.');return;}
  if(!confirm('Importar '+pending.length+' códigos nuevos? Se omiten '+conflicts+' conflictos y '+unknown+' códigos no reconocidos.'))return;
  for(const [key,value] of pending){catalog()[key]=value;loaded++;}
  data.events.push({what:'Base de códigos importada',loaded,conflicts,unknown,at:new Date().toISOString()});save();
  alert('Importados '+loaded+' códigos. Conflictos omitidos: '+conflicts+'.');
 }catch(e){alert('No se pudo importar la base: '+e.message);}
}

ton onclick="digit('9')">9</button><button class="ctl" onclick="clearDigit()">BORRAR</button><button onclick="digit('0')">0</button><button class="ctl" onclick="backDigit()" aria-label="Borrar último dígito"><svg class="vis-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-delete"/></svg></button></div><button id="cAction" class="addbtn vis-button-primary" onclick="actionDigit()"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-plus"/></svg> AÑADIR AL TOTAL</button><div class="count-feedback" id="countFeedback" role="status" aria-live="polite">Aún no has sumado cantidades.</div><div class="c-tools"><span id="cEntries">0 apuntes</span><button class="vis-button-secondary" onclick="openBreakdown()">VER / CORREGIR <svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-chevron-right"/></svg></button></div>`,`<div class="counter-total vis-card"><div class="total-heading">TOTAL ACUMULADO</div><div class="total-reading"><strong id="liveTotal">${fmt(countTotal())}</strong><span class="total-unit">${countedUnitUpper(p)}</span></div><div class="total-staged"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-circle"/></svg> PROVISIONAL · SIN GUARDAR</div></div><div class="counter-footer"><button class="vis-button-secondary" onclick="cancelCount()">${homeIcon('arrow-left')} ${editOriginal!==null?"Desglose":"Artículos"}</button> function registerDiscrepancy(notFound=false){
 const p=getProduct();if(!p)return;
 const d=getLoc(activeLoc),prior=d.counts[activeArticle];
 if(prior&&!editReason){showModal('reason');return;}
 const amount=notFound?0:countTotal();
 const issue={amount,notFound,reason:editReason||(notFound?'Artículo no encontrado':'Diferencia en recuento'),previousAmount:prior?.amount??null,originalEntries:cloneEntries(prior?.entries),proposedEntries:cloneEntries(pendingEntries),entryEdits:entryEdits.map(x=>({...x})),delta:amount-(prior?.amount??0),worker:data.worker,...sessionAudit(),at:new Date().toISOString(),status:'pending'};
 d.incidents[activeArticle]=issue;
 data.events.push({what:'Incidencia pendiente (sin validar)',loc:activeLoc,article:activeArticle,amount,oldAmount:issue.previousAmount,reason:issue.reason,originalEntries:cloneEntries(issue.originalEntries),proposedEntries:cloneEntries(issue.proposedEntries),entryEdits:entryEdits.map(x=>({...x})),worker:data.worker,...sessionAudit(),at:issue.at});
 save();clearDraft();pendingEntries=[];editReason='';editOriginal=null;editReasonChoice='';editReasonNote='';entryEdits=[];
 savedFeedback='⚠ Incidencia registrada para revisión. No se ha dado por válido el artículo.';
 go('articles');
}
function commitCount(warning,notFound=false){
 if(warning||notFound){registerDiscrepancy(!!notFound);return;}
 const p=getProduct();if(!p||countTotal()!==p.theoretical){go('discrepancy');return;}
 const d=getLoc(activeLoc),prior=d.counts[activeArticle];
 if(prior&&!editReason){showModal('reason');return;}
 const rec={entries:pendingEntries.map(x=>({...x})),amount:countTotal(),notFound:false,warning:false,at:new Date().toISOString(),workers:prior?.workers||sessionWorkers(),countMode:prior?.countMode||sessionMode(),lastEditedBy:sessionWorkers()};
 if(prior){rec.corrections=[...(prior.corrections||[]),{oldAmount:prior.amount,newAmount:rec.amount,delta:rec.amount-prior.amount,originalEntries:cloneEntries(prior.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),reason:editReason,worker:data.worker,...sessionAudit(),at:rec.at}];}
 d.counts[activeArticle]=rec;
 const previousIssue=d.incidents[activeArticle];if(previousIssue)delete d.incidents[activeArticle];
 data.events.push({what:prior?'Corrección justificada':'Artículo contado',loc:activeLoc,article:activeArticle,oldAmount:prior?.amount??null,amount:rec.amount,reason:prior?editReason:null,originalEntries:cloneEntries(prior?.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),worker:data.worker,...sessionAudit(),at:rec.at});
 save();clearDraft();
 savedFeedback='✓ GUARDADO: '+esc(p.name)+' · '+fmt(rec.amount)+' unidades.'+(prior?' Corrección registrada con motivo.':'');
 pendingEntries=[];editReason='';editOriginal=null;editReasonChoice='';editReasonNote='';entryEdits=[];go('articles');
}
function markNotFound(){
 const p=getProduct();if(!p)return;
 if(!confirm('¿Registrar que no se ha encontrado '+p.name+' en '+activeLoc+'? Quedará como incidencia pendiente.'))return;
 pendingEntries=[];cInput='';registerDiscrepancy(true);
}

function closeLocation(){
 const p=progress(activeLoc);
 if(p.done!==p.total){showModal('missing');return;}
 go('location-review');
}
function renderLocationReview(){
 const a=items(activeLoc),c=getLoc(activeLoc).counts;
 const pending=a.filter(p=>!c[p.id]);
 const missing=a.filter(p=>c[p.id]?.notFound);
 const added=a.filter(p=>p.extra&&c[p.id]);
 const differences=a.filter(p=>c[p.id]&&!c[p.id].notFound&&(c[p.id].warning||c[p.id].amount!==p.theoretical||p.extra));
 const issues=missing.length+differences.length;
 const rows=a.map(p=>{
  const rec=c[p.id];
  const issue=rec&&(rec.notFound||rec.warning||rec.amount!==p.theoretical||p.extra);
  const status=!rec?'Pendiente':rec.notFound?'No encontrado':issue?'Con aviso':'Contado';
  return '<div class="location-review-item '+(issue?'review-issue':'')+'"><div><b>'+esc(p.name)+'</b><small>'+esc(p.id)+'</small></div><span class="vis-chip inventory-chip '+(issue?'warn':'ok')+'">'+status+'</span></div>';
 }).join('');
 place('<div class="vis-title"><h1>'+esc(activeLoc)+'</h1><p class="vis-help">REVISIÓN ANTES DEL CIERRE · Comprueba los estados. Las cantidades teóricas siguen ocultas.</p></div>'
 +'<div class="review-metrics"><div><strong>'+(a.length-pending.length)+'/'+a.length+'</strong><span>Revisados</span></div><div><strong>'+pending.length+'</strong><span>Pendientes</span></div><div><strong>'+issues+'</strong><span>Incidencias</span></div></div>'
 +(issues?'<div class="vis-notice inventory-notice">Hay '+issues+' referencias con diferencias o incidencias. El responsable las revisará después.</div>':'<div class="vis-notice inventory-notice green">No hay incidencias registradas en esta ubicación.</div>')
 +(missing.length?'<p class="vis-help">Artículos no encontrados: '+missing.length+'</p>':'')
 +(added.length?'<p class="vis-help">Artículos no previstos: '+added.length+'</p>':'')
 +'<div class="vis-card"><h2>Artículos de la ubicación</h2>'+(rows||'<p class="vis-help">Ubicación sin referencias previstas.</p>')+'</div>',
 '<div class="vis-stack"><button class="vis-button-primary" onclick="confirmCloseLocation()">Confirmar cierre de ubicación <svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-right"/></svg></button><button class="back" onclick="go(\'articles\')"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-left"/></svg> Volver a los artículos</button></div>');
}
function confirmCloseLocation(){
 const p=progress(activeLoc);
 if(p.done!==p.total){go('articles');showModal('missing');return;}
 const d=getLoc(activeLoc);
 if(d.closed){go('closed');return;}
 d.closed=true;data.events.push({what:'Ubicación cerrada',loc:activeLoc,worker:data.worker,...sessionAudit(),at:new Date().toISOString()});
 save();go('closed');
}
function renderClosed(){const p=progress(activeLoc);place(`<div class="vis-card inventory-centered"><div class="bigcheck"><svg class="vis-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-circle-check"/></svg></div><div class="vis-title"><h1>Ubicación finalizada</h1><p>${activeLoc}</p></div><p class="vis-help">${p.done} artículos revisados. La información permanece en esta demo local y NO se ha sincronizado.</p></div><div class="vis-notice inventory-notice">En la app real el responsable tendrá que autorizar cualquier reapertura y revisar todas las diferencias, incluso las inferiores a la tolerancia.</div>`,`<button class="vis-button-primary" onclick="go('locations')">Ir a otra ubicación <svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-arrow-right"/></svg></button>`);}
function showModal(m){modal=m;let body='';if(m==='history'){hideModal();openBreakdown();return;}else if(m==='already-counted'){
 const p=getProduct(),rec=getLoc(activeLoc).counts[activeArticle];
 body='<h2><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-triangle-alert"/></svg> Artículo ya contado</h2><p class="vis-help">Este artículo tiene apuntes guardados. Puedes revisar el desglose original antes de proponer cualquier cambio.</p>'
 +'<div class="vis-card"><b>'+esc(p.name)+'</b><p class="vis-help">Recuento guardado: <b>'+fmt(rec.amount)+' unidades</b></p></div>'
 +'<div class="vis-stack"><button class="vis-button-primary" onclick="startEditDetail()">Ver desglose y modificar</button><button class="vis-button-secondary" onclick="hideModal()">Cancelar, no modificar</button></div>';
}else if(m==='reason'){
 const p=getProduct();
 const reasons=['Unidad encontrada tras el recuento y reubicada','Corrección de una ubicación equivocada','Error detectado en el recuento inicial','Mercancía movida tras contar','Otro motivo'];
 body='<h2>Motivo de modificación</h2><p class="vis-help">Vas a corregir el recuento de <b>'+esc(p.name)+'</b>. El cambio se registrará con operario, hora y cantidades anterior y nueva.</p>'
 +'<div class="vis-field"><label for="reasonSelect">Selecciona el motivo (obligatorio)</label><select class="vis-control" id="reasonSelect" onchange="toggleReasonDetails()"><option value="">Seleccionar…</option>'+reasons.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>'
 +'<div class="vis-field" id="reasonDetailsWrap" hidden><label for="reasonDetails">Explica el motivo</label><textarea id="reasonDetails" class="vis-control edit-note" placeholder="Qué ha sucedido y por qué se corrige"></textarea></div>'
 +'<p id="reasonError" class="edit-reason-error"></p>'
 +'<div class="vis-stack"><button class="vis-button-primary" onclick="acceptEditReason()">Continuar con la modificación</button><button class="vis-button-secondary" onclick="hideModal()">Cancelar</button></div>';
}else if(m==='menu'){body=`<div class="vis-title"><h2 id="generalDialogTitle">Opciones de prueba</h2></div><p class="vis-help">Versión instalada: v${APP_VERSION}. Usuario: ${esc(data.worker)}. Los recuentos se guardan en este dispositivo.</p><div class="vis-stack"><button class="vis-button-secondary" onclick="hideModal();checkForUpdates(true)"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-refresh-cw"/></svg> Buscar actualizaciones</button><button class="vis-button-secondary" onclick="hideModal();forceUpdateInventa()"><svg class="vis-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#vis-icon-refresh-cw"/></svg> Forzar nueva carga</button><button class="vis-button-secondary" onclick="exportBarcodeCatalog()">Exportar base de códigos (JSON)</button><button class="vis-button-secondary" onclick="hideModal();$(\'scanImportFile\').click()">Importar base de códigos (JSON)</button><button class="vis-button-secondary" onclick="changeSession()">Cambiar modalidad / pareja</button><button class="vis-button-secondary" onclick="installHelp()">Cómo instalar INVENTA</button><button class="vis-button-secondary" onclick="resetDemo()">Restablecer datos de prueba</button><button class="vis-button-secondary" onclick="logout()">Cambiar operario</button><button class="vis-button-primary" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='help'){body=`<div class="vis-title"><h2 id="generalDialogTitle">Instalar INVENTA</h2></div><p class="vis-help">En iPhone: abre esta dirección desde Safari, pulsa Compartir y elige <b>Añadir a pantalla de inicio</b>. Después abre el icono INVENTA. En Android: menú de Chrome → Instalar aplicación.</p><p class="vis-help">Los archivos básicos se guardan tras la primera carga. Los datos de prueba son solo locales.</p><button class="vis-button-primary" onclick="hideModal()">Entendido</button>`;}else if(m==='unexpected'){body=`<h2>Artículo no listado</h2><p class="vis-help">Registra provisionalmente un artículo encontrado en ${activeLoc}. En la aplicación definitiva se comunicará una incidencia al responsable.</p><div class="vis-field"><label for="unknownCode">Código de artículo</label><input class="vis-control" id="unknownCode" placeholder="Ej. PRD0009999"></div><div class="vis-field"><label for="unknownName">Descripción (opcional)</label><input class="vis-control" id="unknownName" placeholder="Artículo encontrado"></div><button class="vis-button-primary" onclick="addUnexpected()">Añadir a esta ubicación</button><button class="vis-button-secondary" onclick="hideModal()">Cancelar</button><p id="modalError" class="vis-help"></p>`;}else if(m==='missing'){const rem=items(activeLoc).filter(p=>!getLoc(activeLoc).counts[p.id]).length;body=`<h2>Quedan artículos sin revisar</h2><p class="vis-help">Debes contar o marcar «No encontrado» en ${rem} artículo(s) antes de cerrar ${activeLoc}.</p><button class="vis-button-primary" onclick="hideModal()">Seguir contando</button>`;}else if(m==='emptycount'){body=`<h2>Sin cantidades</h2><p class="vis-help">Todavía no hay unidades apuntadas. Si el producto no está en esta ubicación, utiliza «No encontrado».</p><button class="vis-button-primary" onclick="markNotFound()">No encontrado</button><button class="vis-button-secondary" onclick="hideModal()">Seguir contando</button>`;}
$('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)hideModal()"><div class="${['already-counted','reason','unexpected','missing','emptycount'].includes(m)?'inventory-dialog vis-card':'general-dialog vis-card vis-stack'}"${['menu','help'].includes(m)?' role="dialog" aria-modal="true" aria-labelledby="generalDialogTitle"':''}>${body}</div></div>`;}
function hideModal(){$('overlay').innerHTML='';modal='';if(pendingUnknownArticleCode&&screen!=='scanner-saving')pendingUnknownArticleCode='';}
function removeEntry(i){hideModal();openBreakdown();if(i>=0&&i<pendingEntries.length)openEntryEdit(i);}
function addUnexpected(){const code=$('unknownCode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,28);if(!code){$('modalError').textContent='Introduce un código.';return;}if(items(activeLoc).some(p=>p.id===code)){$('modalError').textContent='Ese artículo ya existe en la ubicación.';return;}const pending=pendingUnknownArticleCode;const associated=pending?codeForArticle(pending):null;if(associated&&associated!==code){$('modalError').textContent='El código escaneado ya está vinculado a '+associated+'. Requiere revisión.';return;}const name=$('unknownName').value.trim().slice(0,90);getLoc(activeLoc).extras[code]={name:name||'Artículo encontrado no previsto'};const at=new Date().toISOString();if(pending){catalog()[barcodeKey(pending)]={articleId:code,code:pending,source:'INVENTA',createdAt:at,createdBy:data.worker,updatedAt:at};}data.events.push({what:'Artículo provisional',loc:activeLoc,article:code,barcode:pending||null,at});pendingUnknownArticleCode='';save();hideModal();go('articles');}
function installHelp(){hideModal();showModal('help')}
function logout(){data.worker='';data.countSession=null;activeAisle='';save();hideModal();go('home')}
function resetDemo(){if(!confirm('¿Borrar todos los recuentos de esta DEMO? La base de códigos aprendidos se conservará.'))return;const codes={...catalog()};clearDraft('Operario 1');clearDraft('Operario 2');data=blank();data.barcodeCatalog=codes;save();hideModal();go('home')}
window.addEventListener('online',()=>{if(screen==='locations')render()});window.addEventListener('offline',()=>{if(screen==='locations')render()});
window.addEventListener('load',initInventaUpdates);
// El borrador se recupera tras acceder a Inventario con el usuario correcto.
render();
</script></body></html>
