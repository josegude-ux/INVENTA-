<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST={
 'K00-P01':[{id:'PRD0003563',name:"GINEBRA SEAGRAM'S 70 CL",theoretical:200},{id:'PRD0001287',name:'RON AÑEJO 70 CL',theoretical:30}],
 'K00-P02':[{id:'PRD0002411',name:'REFRESCO LIMÓN 33 CL',theoretical:72},{id:'PRD0001572',name:'AGUA MINERAL 50 CL',theoretical:24}],
 'K00-P03':[],
 'L00-P01':[{id:'PRD0006051',name:'ZUMO NARANJA 1 L',theoretical:60}],
 'L00-P02':[{id:'PRD0008812',name:'GALLETAS SURTIDAS',theoretical:36}],
 'M00-P01':[{id:'PRD0004012',name:'LECHE ENTERA 1 L',theoretical:48}]};
const AISLES={'Operario 1':['K','L'],'Operario 2':['K','M']};
const APP_VERSION='0.19.0';
const KEY='inventa-demo-operario-v015';
const DRAFT_KEY='inventa-demo-draft-v020:';
const blank=()=>({version:1,worker:'',locations:{},events:[]});
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.version===1&&p.locations)return p;}catch(e){}return blank();}
let data=load(),screen=data.worker?'aisles':'login',activeAisle='',activeLoc='',activeArticle='',cMode='direct',cStep=0,cInput='',cParts=[0,0,0,0],pendingEntries=[],pendingResult=null,modal='',verifyValue='',countFeedback='',savedFeedback='',locationFilter='all',lastPallet=null,repeatMode=false,overwriteInput=false,resumedDraft=false;
const fmt=n=>Number(n).toLocaleString('es-ES');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid=s=>/^\d{1,8}$/.test(String(s))&&Number(s)>0&&Number.isSafeInteger(Number(s));
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function items(loc){let base=(TEST[loc]||[]).map(p=>({...p}));let unexpected=Object.entries(data.locations[loc]?.extras||{}).map(([id,v])=>({id,name:v.name||'Artículo encontrado no previsto',theoretical:0,extra:true}));return [...base,...unexpected];}
function getLoc(loc){return data.locations[loc]||(data.locations[loc]={verified:false,counts:{},extras:{},closed:false});}
function draftKey(worker){return DRAFT_KEY+encodeURIComponent(worker);}
function readDraft(worker){
 if(!worker)return null;
 try{
  const d=JSON.parse(localStorage.getItem(draftKey(worker)));
  if(!d||d.version!==2||d.worker!==worker||!(AISLES[worker]||[]).includes(d.loc.slice(0,1)))return null;
  if(!items(d.loc).some(p=>p.id===d.article)||getLoc(d.loc).closed)return null;
  if(!['count','review','discrepancy'].includes(d.screen))return null;
  if(!Array.isArray(d.entries)||d.entries.some(e=>!Number.isSafeInteger(e.amount)||e.amount<=0))return null;
  return d;
 }catch(e){return null;}
}
function clearDraft(worker=data.worker){try{localStorage.removeItem(draftKey(worker));}catch(e){}}
function saveDraft(){
 if(!data.worker||!activeLoc||!activeArticle||!['count','review','discrepancy'].includes(screen))return;
 const d={version:2,worker:data.worker,loc:activeLoc,article:activeArticle,screen,
  entries:pendingEntries.map(e=>({...e})),mode:cMode,step:cStep,input:cInput,
  parts:[...cParts],lastPallet:lastPallet?[...lastPallet]:null,
  repeatMode,overwriteInput,feedback:countFeedback,at:new Date().toISOString()};
 try{localStorage.setItem(draftKey(data.worker),JSON.stringify(d));}catch(e){}
}
function restoreDraft(d){
 activeLoc=d.loc;activeAisle=aisleFor(d.loc);activeArticle=d.article;
 pendingEntries=d.entries.map(e=>({...e}));cMode=d.mode==='pallet'?'pallet':'direct';
 cStep=Math.min(3,Math.max(0,Number(d.step)||0));
 cInput=/^\d{0,8}$/.test(String(d.input||''))?String(d.input||''):'';
 cParts=Array.isArray(d.parts)&&d.parts.length===4?d.parts.map(n=>Number(n)||0):[0,0,0,0];
 lastPallet=Array.isArray(d.lastPallet)&&d.lastPallet.length===4?d.lastPallet.map(Number):null;
 repeatMode=!!d.repeatMode&&!!lastPallet;overwriteInput=!!d.overwriteInput;
 countFeedback=d.feedback||'Recuento recuperado automáticamente. Todavía sin guardar.';
 screen=d.screen;resumedDraft=true;
}
function bestPreviousPallet(entries){
 const e=[...entries].reverse().find(x=>Array.isArray(x.factors)&&x.factors.length===4&&x.factors.every(n=>Number.isSafeInteger(n)&&n>0));
 return e?e.factors.slice():null;
}
function progress(loc){
 const a=items(loc), d=getLoc(loc),c=d.counts;
 const done=a.filter(x=>c[x.id]).length;
 const flagged=a.some(p=>c[p.id]&&(c[p.id].notFound||c[p.id].amount!==p.theoretical||c[p.id].warning)) || a.some(p=>p.extra);
 return {done,total:a.length,closed:d.closed,flagged,complete:d.closed || (a.length>0 && done===a.length),partial:done>0&&done<a.length};
}
function aisleFor(loc){return loc.slice(0,1).toUpperCase();}
function aisleLocations(aisle){return Object.keys(TEST).filter(loc=>aisleFor(loc)===aisle);}
function assignedAisles(){return AISLES[data.worker]||[];}
function openAisle(aisle){if(!assignedAisles().includes(aisle))return;activeAisle=aisle;locationFilter='all';go('locations');}
function setLocationFilter(v){locationFilter=v;renderLocations();}
function statusLabel(p){if(p.flagged)return '⚠ Revisar';if(p.complete)return '✓';if(p.partial)return 'En curso';return 'Pendiente';}

function statusArticle(loc,p){return getLoc(loc).counts[p.id];}
let updateReady=false, updating=false, lastCheck=0, hadController=false, bootAt=Date.now(), reloadedForUpdate=false;
function countingInProgress(){return ['count','review','discrepancy'].includes(screen);}
function showPendingUpdate(){
 const el=$('updateBanner');if(!el)return;
 if(!updateReady){el.hidden=true;return;}
 el.hidden=false;el.innerHTML='<div class="update-msg">↻ Actualización lista para instalar.<br>'+ (countingInProgress()?'Termina de guardar el artículo antes de actualizar.':'Puedes actualizar INVENTA ahora.')+'</div><button onclick="applyInventaUpdate()">'+ (countingInProgress()?'Después':'Actualizar')+'</button>';
}
function applyInventaUpdate(){
 if(countingInProgress()){alert('Guarda o cancela el recuento del artículo antes de actualizar, para no perder cantidades.');return;}
 window.location.reload();
}
function informUpdate(){updateReady=true;if(!countingInProgress()&&Date.now()-bootAt<12000&&!reloadedForUpdate){reloadedForUpdate=true;location.reload();return;}showPendingUpdate();}
async function checkForUpdates(manual=false){
 if(!('serviceWorker' in navigator)){if(manual)alert('No se pueden comprobar actualizaciones en este navegador.');return;}
 if(updating)return;updating=true;
 try{
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg){if(manual)alert('El servicio de actualización aún no está instalado. Cierra y abre INVENTA.');return;}
  await reg.update();lastCheck=Date.now();
  if(reg.waiting&&navigator.serviceWorker.controller){informUpdate();}
  else if(manual&&reg.installing){alert('Se ha detectado una actualización. Se está descargando; aparecerá un aviso cuando esté lista.');}
  else if(manual&&updateReady){showPendingUpdate();}
  else if(manual){alert('INVENTA v'+APP_VERSION+' está actualizada.');}
 }catch(e){if(manual)alert('No se ha podido comprobar la actualización. Revisa la conexión a Internet.');}
 finally{updating=false;}
}
function initInventaUpdates(){
 if(!('serviceWorker' in navigator))return;
 hadController=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)informUpdate();hadController=true;});
 navigator.serviceWorker.register('./service-worker.js').then(reg=>{
   if(reg.waiting&&navigator.serviceWorker.controller)informUpdate();
   const watch=sw=>{if(sw)sw.addEventListener('statechange',()=>{if(sw.state==='installed'&&navigator.serviceWorker.controller)informUpdate();});};
   reg.addEventListener('updatefound',()=>watch(reg.installing));
   checkForUpdates(false);
 }).catch(()=>{});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>60000)checkForUpdates(false);});
}
function go(s){screen=s;render();if(s==='review'||s==='discrepancy')saveDraft();showPendingUpdate();}
function header(){return `<div class="hrow"><div class="brand"><img src="icon-192.png" alt=""><div><b>INVENTA</b><small>Demo operario · v0.19</small></div></div><div class="topbuttons"><span class="pill">SOLO PRUEBA</span>${data.worker?'<button class="tinybtn" onclick="showModal(\'menu\')">☰</button>':''}</div></div>`}
function render(){let counter=screen==='count';$('app').classList.toggle('counter',counter);$('head').innerHTML=header();$('overlay').innerHTML='';if(screen==='login')renderLogin();else if(screen==='aisles')renderAisles();else if(screen==='locations')renderLocations();else if(screen==='verify')renderVerify();else if(screen==='articles')renderArticles();else if(screen==='count')renderCount();else if(screen==='review')renderReview();else if(screen==='discrepancy')renderWarning();else if(screen==='closed')renderClosed();else renderLocations();}
function place(html,foot=''){$('content').innerHTML=html;$('foot').innerHTML=foot;}
function renderLogin(){place(`<div class="title"><div class="overline">IDENTIFICACIÓN</div><h1>Empezar inventario</h1><p class="muted">Selecciona tu usuario y escribe tu PIN de demostración.</p></div><div class="card"><div class="field"><label for="worker">Operario</label><select class="input" id="worker"><option value="Operario 1">Operario 1</option><option value="Operario 2">Operario 2</option></select></div><div class="field"><label for="pin">PIN de prueba</label><input class="input" id="pin" type="password" inputmode="numeric" placeholder="4 cifras" maxlength="4" autocomplete="off"></div><div class="alert">PIN de la demostración: <b>1234</b>. No es una identificación segura ni conecta con la empresa.</div><button class="btn" onclick="login()">Entrar al inventario →</button><p id="loginError" class="muted" style="margin-top:9px"></p></div><p class="muted">La demo guarda el avance en este dispositivo. No sincroniza con Supabase ni Business Central.</p>`);$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});}
function login(){if($('pin').value!=='1234'){$('loginError').textContent='PIN incorrecto. Usa el PIN de demostración.';return;}data.worker=$('worker').value;activeAisle='';save();const d=readDraft(data.worker);if(d){restoreDraft(d);render();}else go('aisles');}
function renderAisles(){
 const aisles=assignedAisles();
 const tiles=aisles.map(a=>{
   const locs=aisleLocations(a);
   const done=locs.filter(l=>progress(l).complete).length;
   const issues=locs.filter(l=>progress(l).flagged).length;
   const percent=locs.length?Math.round(100*done/locs.length):0;
   return `<button class="item aisle-item" onclick="openAisle('${a}')"><span class="aisle-letter">${a}</span><span class="aisle-details"><strong>Pasillo ${a}</strong><small>${done} de ${locs.length} ubicaciones revisadas${issues?` · ⚠ ${issues} con aviso`:''}</small><span class="mini-progress"><span style="width:${percent}%"></span></span></span><span class="chev">›</span></button>`;
 }).join('');
 place(`<div class="title"><div class="overline">INVENTARIO ASIGNADO</div><h1>Hola, ${esc(data.worker)}</h1><p class="muted">Elige por qué pasillo quieres empezar o continuar.</p></div>${tiles}<div class="alert">Demo: estos pasillos están asignados solo como ejemplo. En la versión definitiva los asignará el responsable.</div>`,`<span class="muted">Puedes cambiar de pasillo al volver aquí.</span>`);
}
function renderLocations(){
 if(!assignedAisles().includes(activeAisle)){go('aisles');return;}
 const locs=aisleLocations(activeAisle);
 const counts={all:locs.length,pending:0,counted:0,issues:0};
 for(const l of locs){const p=progress(l);if(p.complete)counts.counted++;else counts.pending++;if(p.flagged)counts.issues++;}
 const options=[['all','Todas'],['pending','Pendientes'],['counted','Contadas'],['issues','⚠ Diferencias']];
 const matching=locs.filter(l=>{
   const p=progress(l);
   if(locationFilter==='pending')return !p.complete;
   if(locationFilter==='counted')return p.complete;
   if(locationFilter==='issues')return p.flagged;
   return true;
 });
 const html=matching.map(l=>{
  const p=progress(l);
  const state=p.complete?'done-location':p.partial?'partial-location':'';
  const issue=p.flagged?'flag-location':'';
  const suffix=p.flagged?'<span class="flag-ico">⚠</span>':p.complete?'<span class="done-ico">✓</span>':`<span class="tag">${p.done}/${p.total||0}</span>`;
  const detail=p.complete?'Recuento completo':p.partial?`${p.done}/${p.total} artículos · en curso`:'Pendiente de recuento';
  return `<button class="item location-item ${state} ${issue}" onclick="openLocation('${l}')"><span><strong>${l}</strong><small>${detail}</small></span>${suffix}<span class="chev">›</span></button>`;
 }).join('');
 place(`<div class="title"><div class="overline">PASILLO ${activeAisle} · UBICACIONES</div><div class="between"><h1>${activeAisle} · Mis ubicaciones</h1><span class="tag">${counts.counted}/${counts.all} revisadas</span></div><p class="muted">Las ubicaciones con fondo verde ya tienen todos sus artículos revisados.</p></div>
 <div class="filters">${options.map(([key,label])=>`<button class="${locationFilter===key?'selected':''}" onclick="setLocationFilter('${key}')">${label}<span>${counts[key]}</span></button>`).join('')}</div>
 ${html || '<div class="card"><p class="muted">No hay ubicaciones con este filtro.</p></div>'}
 <p class="muted">⚠ señala una diferencia o incidencia sin mostrar las existencias teóricas.</p>`,
 `<button class="back" onclick="go('aisles')">← Cambiar de pasillo</button>`);
}

function openLocation(loc){if(aisleFor(loc)!==activeAisle)return;savedFeedback='';activeLoc=loc;const d=getLoc(loc);if(d.closed){go('closed')}else if(d.verified){go('articles')}else{verifyValue='';go('verify')}}
function renderVerify(){place(`<div class="title"><div class="overline">PASO 1 · UBICACIÓN</div><h1>${activeLoc}</h1><p class="muted">Comprueba que estás delante de la ubicación correcta. Puedes leer su etiqueta con un escáner que escriba el código, o confirmarla visualmente.</p></div><div class="card"><div class="field"><label for="locationBarcode">Código de ubicación</label><input class="input" id="locationBarcode" autocapitalize="characters" autocomplete="off" placeholder="${activeLoc}" value="${esc(verifyValue)}"></div><button class="btn" onclick="confirmLocation(false)">Verificar código →</button><div style="height:11px"></div><button class="btn btn-light" onclick="confirmLocation(true)">Confirmar visualmente</button><p id="verifyError" class="muted" style="margin-top:9px"></p></div>`,`<button class="back" onclick="go('locations')">← Ubicaciones del pasillo</button>`);$('locationBarcode').addEventListener('keydown',e=>{if(e.key==='Enter')confirmLocation(false)});}
function confirmLocation(manual){if(!manual&&$('locationBarcode').value.trim().toUpperCase()!==activeLoc){$('verifyError').textContent='El código no coincide con '+activeLoc+'. Revisa la ubicación.';return;}const d=getLoc(activeLoc);d.verified=true;data.events.push({what:'Ubicación confirmada',loc:activeLoc,mode:manual?'visual':'código',at:new Date().toISOString()});save();go('articles');}
function renderArticles(){const d=getLoc(activeLoc),a=items(activeLoc),p=progress(activeLoc);place(`${savedFeedback?`<div class="alert green" role="status">${savedFeedback}</div>`:""}<div class="title"><div class="overline">PASO 2 · ARTÍCULOS</div><div class="between"><h1>${activeLoc}</h1><span class="tag ${p.done===p.total?'ok':''}">${p.done}/${p.total} contados</span></div><p class="muted">Pulsa un artículo o busca su código. Sin cantidades teóricas.</p></div><p class="article-legend"><b>■ Verde</b>: recuento registrado · <span style="color:#ad6e18">⚠ Naranja</span>: diferencia o incidencia</p><div class="field"><input class="input" id="articleSearch" placeholder="Buscar por código o nombre" oninput="filterArticles(this.value)"></div><div id="articleList"></div><div class="card"><button class="btn-outline" style="width:100%" onclick="showModal('unexpected')">+ Artículo que no aparece en la lista</button></div>${a.length===0?'<div class="alert">No hay artículos previstos. Si la ubicación está realmente vacía, puedes confirmarlo abajo.</div>':''}`,`<div class="stack"><button class="btn" onclick="closeLocation()">${a.length===0?'Confirmar ubicación vacía':'Finalizar ubicación'}</button><button class="back" onclick="go('locations')">← Ubicaciones de ${activeAisle}</button></div>`);filterArticles('');}
function filterArticles(query){
 const a=items(activeLoc).filter(p=>(p.id+' '+p.name).toLowerCase().includes(String(query).toLowerCase()));
 $('articleList').innerHTML=a.length?a.map(p=>{
  const rec=statusArticle(activeLoc,p);
  const counted=!!rec;
  const issue=counted&&(rec.notFound||rec.warning||rec.amount!==p.theoretical||p.extra);
  const style=counted?'counted-article':'';
  const warning=issue?'issue-article':'';
  const label=!counted?'Pendiente':rec.notFound?'⚠ No encontrado':issue?'⚠ Diferencia':'✓ Contada';
  return `<button class="item article-item ${style} ${warning}" onclick="openArticle('${esc(p.id)}')"><span><strong style="font-size:16px">${esc(p.name)}</strong><small>${esc(p.id)}${p.extra?' · Artículo añadido':''}</small></span><span class="tag ${issue?'warn':counted?'ok':''}">${label}</span><span class="chev">›</span></button>`;
 }).join(''):'<div class="alert">No se han encontrado artículos con ese texto.</div>';
}

function openArticle(id){activeArticle=id;pendingResult=null;savedFeedback='';countFeedback='';const d=readDraft(data.worker);if(d&&d.loc===activeLoc&&d.article===id){restoreDraft(d);render();return;}const rec=getLoc(activeLoc).counts[id];pendingEntries=rec&&!rec.notFound?rec.entries.map(x=>({...x})):[];cMode='direct';cStep=0;cInput='';cParts=[0,0,0,0];lastPallet=bestPreviousPallet(pendingEntries);repeatMode=false;overwriteInput=false;go('count');}
function getProduct(){return items(activeLoc).find(p=>p.id===activeArticle)}
function countedUnit(){return 'unidades';}
function countedUnitUpper(){return 'UNIDADES';}
function countTotal(){return pendingEntries.reduce((sum,e)=>sum+e.amount,0)}
function renderCount(){const p=getProduct();const rec=getLoc(activeLoc).counts[p.id];place(`<div class="cproduct"><span>${esc(activeLoc)} · ${esc(p.id)}</span><b>${esc(p.name)}</b><small>Unidad de recuento: <strong>UNIDADES</strong></small></div><div class="modebar"><button id="modeDirect" onclick="setMode('direct')">+ CANTIDAD</button><button id="modePallet" onclick="setMode('pallet')">▦ CÁLCULO DE PALÉS</button></div><div class="between" style="margin-bottom:7px"><span class="muted" id="cStep" style="color:#b9cadd"></span><span id="cProgress" class="tag"></span></div><div class="display"><div class="caption"><span id="cCaption">Cantidad directa</span><span id="cUnit">${countedUnitUpper(p)}</span></div><div class="digits" id="cDigits">0</div><div class="desc" id="cDesc"></div></div><div class="keypad"><button onclick="digit('1')">1</button><button onclick="digit('2')">2</button><button onclick="digit('3')">3</button><button onclick="digit('4')">4</button><button onclick="digit('5')">5</button><button onclick="digit('6')">6</button><button onclick="digit('7')">7</button><button onclick="digit('8')">8</button><button onclick="digit('9')">9</button><button class="ctl" onclick="clearDigit()">BORRAR</button><button onclick="digit('0')">0</button><button class="ctl" onclick="backDigit()">⌫</button></div><button id="cAction" class="addbtn" onclick="actionDigit()">+ AÑADIR AL TOTAL</button><div class="count-feedback" id="countFeedback" role="status" aria-live="polite">Aún no has sumado cantidades.</div><div class="c-tools"><span id="cEntries">0 apuntes</span><button onclick="showModal('history')">VER / CORREGIR ›</button></div>`,`<div class="counter-total"><div class="total-heading">TOTAL ACUMULADO</div><div class="total-reading"><strong id="liveTotal">${fmt(countTotal())}</strong><span class="total-unit">${countedUnitUpper(p)}</span></div><div class="total-staged">● PROVISIONAL · SIN GUARDAR</div></div><div class="counter-footer"><button onclick="cancelCount()">← Artículos</button><button onclick="undoEntry()">↶ Deshacer</button><button onclick="prepareReview()">IR A CONFIRMAR →</button></div>`);drawCount();}
function setMode(v){cMode=v;cStep=0;cInput='';cParts=[0,0,0,0];countFeedback='';drawCount();}
function digit(n){if(cInput.length>=8)return;cInput=(cInput+n).replace(/^0+(?=\d)/,'');if(cInput==='0')cInput='';drawCount();}
function clearDigit(){cInput='';drawCount()};function backDigit(){cInput=cInput.slice(0,-1);drawCount()};
function drawCount(){
 if(screen!=='count')return;
 const n=valid(cInput)?Number(cInput):0;
 const labels=['Número de palés','Cajas por base','Número de alturas','Unidades por caja'];
 const units=['PALÉS','CAJAS','ALTURAS','UNIDADES'];
 $('modeDirect').classList.toggle('on',cMode==='direct');
 $('modePallet').classList.toggle('on',cMode==='pallet');
 $('cDigits').textContent=cInput||'0';
 $('cCaption').textContent=cMode==='direct'?'Unidades contadas':labels[cStep];
 $('cUnit').textContent=cMode==='direct'?'UNIDADES':units[cStep];
 $('cStep').textContent=cMode==='direct'?'Introduce una cantidad suelta':'Palés · paso '+(cStep+1)+' de 4';
 $('cProgress').textContent=cMode==='direct'?'DIRECTO':(cStep+1)+'/4';
 let product=0;
 if(cMode==='direct'){
  $('cDesc').textContent='Cada añadido se suma al total provisional.';
 }else{
  const guide=[
   '¿Cuántos palés iguales quieres contar?',
   'Palés: '+cParts[0]+'. Indica las cajas de cada base.',
   cParts[0]+' palés × '+cParts[1]+' cajas/base. Indica las alturas.',
   'Si cada caja cuenta como una unidad, introduce 1.'
  ];
  if(cStep===3&&n){
   product=cParts[0]*cParts[1]*cParts[2]*n;
   $('cDesc').textContent=[...cParts.slice(0,3),n].join(' × ')+' = '+fmt(product)+' unidades';
  }else{$('cDesc').textContent=guide[cStep];}
 }
 $('cAction').textContent=cMode==='direct'?'+ AÑADIR CANTIDAD':cStep<3?'SIGUIENTE ›':'+ SUMAR PALÉS AL TOTAL';
 const tooLarge=cMode==='pallet'&&cStep===3&&n&&(!Number.isSafeInteger(product)||product>99999999);
 $('cAction').disabled=!n||!!tooLarge;
 if(tooLarge)$('cDesc').textContent='Resultado demasiado grande. Revisa los factores.';
 $('cEntries').textContent=pendingEntries.length+' '+(pendingEntries.length===1?'apunte':'apuntes')+' realizados';
 $('liveTotal').textContent=fmt(countTotal());
 $('countFeedback').textContent=countFeedback||'Cantidad aún no guardada. Pulsa AÑADIR para incorporarla al total.';
}
function actionDigit(){
 if(!valid(cInput))return;
 const n=Number(cInput);let added=0;
 if(cMode==='direct'){
  pendingEntries.push({kind:'directa',detail:n+' unidades',amount:n});added=n;cInput='';
 }else{
  cParts[cStep]=n;
  if(cStep<3){cStep++;cInput='';countFeedback='Cálculo de palés en preparación. Falta completar los factores.';}
  else{
   const amount=cParts.reduce((acc,val)=>acc*val,1);
   if(!Number.isSafeInteger(amount)||amount>99999999)return;
   pendingEntries.push({kind:'palés',detail:cParts[0]+' palés × '+cParts[1]+' cajas/base × '+cParts[2]+' alturas × '+cParts[3]+' unidades/caja',amount});
   added=amount;cStep=0;cInput='';cParts=[0,0,0,0];
  }
 }
 if(added)countFeedback='✓ +'+fmt(added)+' UNIDADES AÑADIDAS · TOTAL '+fmt(countTotal())+' · TODAVÍA SIN GUARDAR';
 drawCount();
}
function undoEntry(){if(pendingEntries.length){const n=pendingEntries.pop().amount;countFeedback=`↶ Se han quitado ${fmt(n)} unidades · total ${fmt(countTotal())}. Aún sin guardar.`;}drawCount();}
function cancelCount(){if((pendingEntries.length||cInput||cParts.some(Boolean)||repeatMode)&&!confirm('Hay un recuento en curso. ¿Quieres descartarlo y volver al listado?'))return;clearDraft();go('articles');}
function prepareReview(){if(countTotal()===0){showModal('emptycount');return;}pendingResult='counted';go('review');}
function renderReview(){const p=getProduct();place(`<div class="title"><div class="overline">PASO 4 · REVISIÓN</div><h1>Confirmar recuento</h1><p class="muted">${esc(activeLoc)} · ${esc(p.name)}</p></div><div class="card" style="text-align:center"><div class="overline">TOTAL CONTADO</div><div style="font-size:48px;font-weight:950;color:#142f4f">${fmt(countTotal())}</div><div class="muted">${countedUnit(p)} · ${pendingEntries.length} apuntes</div></div><div class="card"><h2>Detalle</h2>${pendingEntries.map(e=>`<div class="between" style="border-bottom:1px solid #edf0f5;padding:8px 0"><span class="muted">${esc(e.kind)}: ${esc(e.detail)}</span><b>+${fmt(e.amount)}</b></div>`).join('')}</div><div class="alert">Al guardar, INVENTA comprobará si la desviación supera la tolerancia de aviso. El operario no verá la cantidad teórica.</div>`,`<div class="stack"><button class="btn" onclick="validateCount()">CONFIRMAR Y GUARDAR ARTÍCULO →</button><button class="back" onclick="go('count')">← Modificar cantidades</button></div>`);}
const tolerance=expected=>Math.max(2,Math.floor(expected*.05));
function validateCount(){const p=getProduct(),amount=countTotal(),diff=Math.abs(amount-p.theoretical);pendingResult='counted';if(diff>tolerance(p.theoretical)){go('discrepancy');}else{commitCount(false);}}
function renderWarning(){const p=getProduct();place(`<div class="title"><div class="overline">COMPROBACIÓN AUTOMÁTICA</div><h1>⚠️ Revisa tu recuento</h1><p class="muted">${esc(p.name)}</p></div><div class="alert red"><b>Atención:</b> la cantidad introducida presenta una diferencia superior a la tolerancia configurada. Puede haber un error de conteo.</div><div class="card" style="text-align:center"><div class="overline">HAS CONTADO</div><div style="font-size:48px;font-weight:950">${fmt(countTotal())}</div><span class="muted">${countedUnit(p)}</span></div><p class="muted">Vuelve a comprobar la mercancía. Si estás seguro del recuento, puedes confirmarlo. El responsable revisará la diferencia.</p>`,`<div class="stack"><button class="btn" onclick="go('count')">Volver a contar</button><button class="btn-outline" onclick="commitCount(true)">Confirmar esta cantidad</button></div>`);}
function commitCount(warning,notFound=false){const rec={entries:pendingEntries.map(x=>({...x})),amount:notFound?0:countTotal(),notFound:!!notFound,warning:!!warning,at:new Date().toISOString()};const p=getProduct();getLoc(activeLoc).counts[activeArticle]=rec;data.events.push({what:notFound?'No encontrado':'Artículo contado',loc:activeLoc,article:activeArticle,amount:rec.amount,warning:rec.warning,at:rec.at});save();clearDraft();savedFeedback=`✓ GUARDADO: ${esc(p.name)} · ${fmt(rec.amount)} unidades. Puedes pasar al siguiente artículo.`;pendingEntries=[];go('articles');}
function markNotFound(){pendingEntries=[];cInput='';const p=getProduct();if(!confirm(`Confirmar que no se ha encontrado ${p.name} en ${activeLoc}?`))return;const warn=p.theoretical>tolerance(p.theoretical);commitCount(warn,true);}
function closeLocation(){const p=progress(activeLoc);if(p.done!==p.total){showModal('missing');return;}const d=getLoc(activeLoc);d.closed=true;data.events.push({what:'Ubicación cerrada',loc:activeLoc,at:new Date().toISOString()});save();go('closed');}
function renderClosed(){const p=progress(activeLoc);place(`<div class="card" style="text-align:center;padding:25px 15px"><div class="bigcheck">✅</div><h1 style="margin:9px 0">Ubicación finalizada</h1><h2>${activeLoc}</h2><p class="muted" style="margin-top:7px">${p.done} artículos revisados. La información permanece en esta demo local y NO se ha sincronizado.</p></div><div class="alert">En la app real el responsable tendrá que autorizar cualquier reapertura y revisar todas las diferencias, incluso las inferiores a la tolerancia.</div>`,`<button class="btn" onclick="go('locations')">Ir a otra ubicación →</button>`);}
function showModal(m){modal=m;let body='';if(m==='history'){body=`<h2>Detalle del recuento</h2>${pendingEntries.length?pendingEntries.map((e,i)=>`<div class="line"><span>${esc(e.detail)}<br><b>+${fmt(e.amount)}</b></span><button onclick="removeEntry(${i})">Eliminar</button></div>`).join(''):'<p class="muted">Sin cantidades añadidas.</p>'}<div class="modal-actions"><button class="btn-outline" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='menu'){body=`<h2>Opciones de prueba</h2><p class="muted">Versión instalada: v${APP_VERSION}. Usuario: ${esc(data.worker)}. Los recuentos se guardan en este dispositivo.</p><div class="stack" style="margin-top:12px"><button class="btn-outline" onclick="hideModal();checkForUpdates(true)">↻ Buscar actualizaciones</button><button class="btn-outline" onclick="installHelp()">Cómo instalar INVENTA</button><button class="btn-outline" onclick="resetDemo()">Restablecer datos de prueba</button><button class="btn-outline" onclick="logout()">Cambiar operario</button><button class="btn" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='help'){body=`<h2>Instalar INVENTA</h2><p class="muted">En iPhone: abre esta dirección desde Safari, pulsa Compartir y elige <b>Añadir a pantalla de inicio</b>. Después abre el icono INVENTA. En Android: menú de Chrome → Instalar aplicación.</p><p class="muted" style="margin-top:10px">Los archivos básicos se guardan tras la primera carga. Los datos de prueba son solo locales.</p><button class="btn" style="margin-top:12px" onclick="hideModal()">Entendido</button>`;}else if(m==='unexpected'){body=`<h2>Artículo no listado</h2><p class="muted">Registra provisionalmente un artículo encontrado en ${activeLoc}. En la aplicación definitiva se comunicará una incidencia al responsable.</p><div class="field" style="margin-top:11px"><label for="unknownCode">Código de artículo</label><input class="input" id="unknownCode" placeholder="Ej. PRD0009999"></div><div class="field"><label for="unknownName">Descripción (opcional)</label><input class="input" id="unknownName" placeholder="Artículo encontrado"></div><button class="btn" onclick="addUnexpected()">Añadir a esta ubicación</button><button class="back" onclick="hideModal()">Cancelar</button><p id="modalError" class="muted"></p>`;}else if(m==='missing'){const rem=items(activeLoc).filter(p=>!getLoc(activeLoc).counts[p.id]).length;body=`<h2>Quedan artículos sin revisar</h2><p class="muted">Debes contar o marcar «No encontrado» en ${rem} artículo(s) antes de cerrar ${activeLoc}.</p><button class="btn" style="margin-top:11px" onclick="hideModal()">Seguir contando</button>`;}else if(m==='emptycount'){body=`<h2>Sin cantidades</h2><p class="muted">Todavía no hay unidades apuntadas. Si el producto no está en esta ubicación, utiliza «No encontrado».</p><button class="btn" style="margin-top:10px" onclick="markNotFound()">No encontrado</button><button class="btn-outline" style="width:100%;margin-top:8px" onclick="hideModal()">Seguir contando</button>`;}
$('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)hideModal()"><div class="modal">${body}</div></div>`;}
function hideModal(){$('overlay').innerHTML='';modal='';}
function removeEntry(i){pendingEntries.splice(i,1);hideModal();renderCount();showModal('history');}
function addUnexpected(){const code=$('unknownCode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,28);if(!code){$('modalError').textContent='Introduce un código.';return;}if(items(activeLoc).some(p=>p.id===code)){$('modalError').textContent='Ese artículo ya existe en la ubicación.';return;}const name=$('unknownName').value.trim().slice(0,90);getLoc(activeLoc).extras[code]={name:name||'Artículo encontrado no previsto'};data.events.push({what:'Artículo provisional',loc:activeLoc,article:code,at:new Date().toISOString()});save();hideModal();go('articles');}
function installHelp(){hideModal();showModal('help')}
function logout(){data.worker='';activeAisle='';save();hideModal();go('login')}
function resetDemo(){if(!confirm('¿Borrar todos los recuentos de esta DEMO en este dispositivo?'))return;clearDraft('Operario 1');clearDraft('Operario 2');data=blank();save();hideModal();go('login')}
