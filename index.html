<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST={
 'K00-P01':[{id:'PRD0003563',name:"GINEBRA SEAGRAM'S 70 CL",theoretical:200},{id:'PRD0001287',name:'RON AÑEJO 70 CL',theoretical:30}],
 'K00-P02':[{id:'PRD0002411',name:'REFRESCO LIMÓN 33 CL',theoretical:72},{id:'PRD0001572',name:'AGUA MINERAL 50 CL',theoretical:24}],
 'K00-P03':[],
 'L00-P01':[{id:'PRD0006051',name:'ZUMO NARANJA 1 L',theoretical:60}],
 'L00-P02':[{id:'PRD0008812',name:'GALLETAS SURTIDAS',theoretical:36}],
 'M00-P01':[{id:'PRD0004012',name:'LECHE ENTERA 1 L',theoretical:48}]};
const AISLES={'Operario 1':['K','L'],'Operario 2':['K','M']};
const APP_VERSION='0.23.0';
const KEY='inventa-demo-operario-v015';
const DRAFT_KEY='inventa-demo-draft-v020:';
const blank=()=>({version:1,worker:'',locations:{},events:[]});
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));if(p?.version===1&&p.locations)return p;}catch(e){}return blank();}
let data=load(),screen=data.worker?'aisles':'login',activeAisle='',activeLoc='',activeArticle='',cMode='direct',cStep=0,cInput='',cParts=[0,0,0,0],pendingEntries=[],pendingResult=null,modal='',verifyValue='',countFeedback='',savedFeedback='',locationFilter='all',lastPallet=null,repeatMode=false,overwriteInput=false,resumedDraft=false,editReason='',editOriginal=null,editReasonChoice='',editReasonNote='',editingIndex=-1,entryEdits=[];
const fmt=n=>Number(n).toLocaleString('es-ES');
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid=s=>/^\d{1,8}$/.test(String(s))&&Number(s)>0&&Number.isSafeInteger(Number(s));
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function items(loc){let base=(TEST[loc]||[]).map(p=>({...p}));let unexpected=Object.entries(data.locations[loc]?.extras||{}).map(([id,v])=>({id,name:v.name||'Artículo encontrado no previsto',theoretical:0,extra:true}));return [...base,...unexpected];}
function getLoc(loc){const d=data.locations[loc]||(data.locations[loc]={verified:false,counts:{},extras:{},closed:false,incidents:{}});if(!d.incidents)d.incidents={};return d;}
function draftKey(worker){return DRAFT_KEY+encodeURIComponent(worker);}
function readDraft(worker){
 if(!worker)return null;
 try{
  const d=JSON.parse(localStorage.getItem(draftKey(worker)));
  if(!d||d.version!==2||d.worker!==worker||!(AISLES[worker]||[]).includes(d.loc.slice(0,1)))return null;
  if(!items(d.loc).some(p=>p.id===d.article)||getLoc(d.loc).closed)return null;
  if(!['count','review','discrepancy','edit-detail'].includes(d.screen))return null;
  if(!Array.isArray(d.entries)||d.entries.some(e=>!Number.isSafeInteger(e.amount)||e.amount<=0))return null;
  return d;
 }catch(e){return null;}
}
function clearDraft(worker=data.worker){try{localStorage.removeItem(draftKey(worker));}catch(e){}}
function saveDraft(){
 if(!data.worker||!activeLoc||!activeArticle||!['count','review','discrepancy','edit-detail'].includes(screen))return;
 const d={version:2,worker:data.worker,loc:activeLoc,article:activeArticle,screen,
  entries:pendingEntries.map(e=>({...e})),mode:cMode,step:cStep,input:cInput,
  parts:[...cParts],lastPallet:lastPallet?[...lastPallet]:null,
  repeatMode,overwriteInput,editReason,editOriginal,editReasonChoice,editReasonNote,entryEdits:entryEdits.map(x=>({...x})),feedback:countFeedback,at:new Date().toISOString()};
 try{localStorage.setItem(draftKey(data.worker),JSON.stringify(d));}catch(e){}
}
function restoreDraft(d){
 activeLoc=d.loc;activeAisle=aisleFor(d.loc);activeArticle=d.article;
 pendingEntries=d.entries.map(e=>({...e}));cMode=d.mode==='pallet'?'pallet':'direct';

function nextPending(){
 const list=items(activeLoc),curr=list.findIndex(p=>p.id===activeArticle);
 // Priorizar los que nunca fueron contados y no tienen incidencias.
 for(let step=1;step<=list.length;step++){
  const idx=(curr+step+list.length)%list.length;
  const p=list[idx];
  if(!statusArticle(activeLoc,p)&&!incidentArticle(activeLoc,p)){openArticle(p.id);return;}
 }
 // El resto requiere revisión: la ubicación sigue abierta.
 const issues=list.filter(p=>!isCountVerified(activeLoc,p));
 if(issues.length){savedFeedback='⚠ Quedan '+issues.length+' referencia(s) sin validar o con incidencia pendiente.';go('articles');return;}
 closeLocation();
}

tal-staged">● PROVISIONAL · SIN GUARDAR</div></div><div class="counter-footer"><button onclick="cancelCount()">${editOriginal!==null?"← Desglose":"← Artículos"}</button><button onclick="openBreakdown()">✎ Corregir</button><button onclick="prepareReview()">IR A CONFIRMAR →</button></div>`);drawCount();}

function repeatLastPallet(){

function drawCount(){
 if(screen!=='count')return;
 const n=valid(cInput)?Number(cInput):0;
 const labels=['Número de palés','Cajas por base','Número de alturas','Unidades por caja'];
 const units=['PALÉS','CAJAS','ALTURAS','UNIDADES'];

 $('cStep').textContent=cMode==='direct'?'Introduce una cantidad suelta':repeatMode?'Repetir palés · cambia la cantidad':'Palés · paso '+(cStep+1)+' de 4';

 const row=$('reusePalletRow');if(row)row.hidden=!(lastPallet&&lastPallet.length===4&&!repeatMode);
 let product=0;
 if(cMode==='direct'){$('cDesc').textContent='Cada añadido se suma al total provisional.';}
 else if(repeatMode){
  const factors=[n,...lastPallet.slice(1)];product=factors.reduce((a,b)=>a*b,1);
  $('cDesc').textContent=factors.join(' × ')+' = '+fmt(product)+' unidades';
 }else{
  const guide=[
   '¿Cuántos palés iguales quieres contar?',
   'Palés: '+cParts[0]+'. Indica las cajas de cada base.',
   cParts[0]+' palés × '+cParts[1]+' cajas/base. Indica las alturas.',
   'Si cada caja cuenta como una unidad, introduce 1.'
  ];
  if(cStep===3&&n){
   product=cParts[0]*cParts[1]*cParts[2]*n;
   $('cDesc').textContent=[...cParts.slice(0,3),n].join(' × ')+' = '+fmt(product)+' unidades';
  }else{$('cDesc').textContent=guide[cStep];}
 }
 $('cAction').textContent=cMode==='direct'?'+ AÑADIR CANTIDAD':repeatMode?'+ SUMAR PALÉS REPETIDOS':cStep<3?'SIGUIENTE ›':'+ SUMAR PALÉS AL TOTAL';
 const finalProduct=cMode==='pallet'&&(repeatMode||cStep===3);
 const tooLarge=finalProduct&&n&&(!Number.isSafeInteger(product)||product>99999999);
 $('cAction').disabled=!n||!!tooLarge;
 if(tooLarge)$('cDesc').textContent='Resultado demasiado grande. Revisa los factores.';
 $('cEntries').textContent=pendingEntries.length+' '+(pendingEntries.length===1?'apunte':'apuntes')+' realizados';
 $('liveTotal').textContent=fmt(countTotal());

}
function actionDigit(){
 if(!valid(cInput))return;
 const n=Number(cInput);let added=0;
 if(cMode==='direct'){
  pendingEntries.push({kind:'directa',detail:n+' unidades',amount:n});added=n;cInput='';
 }else if(repeatMode){
  const factors=[n,...lastPallet.slice(1)];
  const amount=factors.reduce((a,b)=>a*b,1);
  if(!Number.isSafeInteger(amount)||amount>99999999)return;
  pendingEntries.push({kind:'palés',detail:factors[0]+' palés × '+factors[1]+' cajas/base × '+factors[2]+' alturas × '+factors[3]+' unidades/caja',factors,amount});
  lastPallet=factors.slice();added=amount;cStep=0;cInput='';cParts=[0,0,0,0];repeatMode=false;overwriteInput=false;
 }else{
  cParts[cStep]=n;
  if(cStep<3){cStep++;cInput='';countFeedback='Cálculo de palés en preparación. Falta completar los factores.';}
  else{
   const amount=cParts.reduce((a,b)=>a*b,1);
   if(!Number.isSafeInteger(amount)||amount>99999999)return;
   const factors=cParts.slice();
   pendingEntries.push({kind:'palés',detail:factors[0]+' palés × '+factors[1]+' cajas/base × '+factors[2]+' alturas × '+factors[3]+' unidades/caja',factors,amount});
   lastPallet=factors;added=amount;cStep=0;cInput='';cParts=[0,0,0,0];
  }
 }
 if(added)countFeedback='✓ +'+fmt(added)+' UNIDADES AÑADIDAS · TOTAL '+fmt(countTotal())+' · TODAVÍA SIN GUARDAR';
 drawCount();
}

function commitCount(warning,notFound=false){

 const d=getLoc(activeLoc),prior=d.counts[activeArticle];

 if(prior){rec.corrections=[...(prior.corrections||[]),{oldAmount:prior.amount,newAmount:rec.amount,delta:rec.amount-prior.amount,originalEntries:cloneEntries(prior.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),reason:editReason,worker:data.worker,at:rec.at}];}
 d.counts[activeArticle]=rec;
 const previousIssue=d.incidents[activeArticle];if(previousIssue)delete d.incidents[activeArticle];
 data.events.push({what:prior?'Corrección justificada':'Artículo contado',loc:activeLoc,article:activeArticle,oldAmount:prior?.amount??null,amount:rec.amount,reason:prior?editReason:null,originalEntries:cloneEntries(prior?.entries),newEntries:cloneEntries(rec.entries),entryEdits:entryEdits.map(x=>({...x})),worker:data.worker,at:rec.at});

}

}else if(m==='menu'){body=`<h2>Opciones de prueba</h2><p class="muted">Versión instalada: v${APP_VERSION}. Usuario: ${esc(data.worker)}. Los recuentos se guardan en este dispositivo.</p><div class="stack" style="margin-top:12px"><button class="btn-outline" onclick="hideModal();checkForUpdates(true)">↻ Buscar actualizaciones</button><button class="btn-outline" onclick="installHelp()">Cómo instalar INVENTA</button><button class="btn-outline" onclick="resetDemo()">Restablecer datos de prueba</button><button class="btn-outline" onclick="logout()">Cambiar operario</button><button class="btn" onclick="hideModal()">Cerrar</button></div>`;}else if(m==='help'){body=`<h2>Instalar INVENTA</h2><p class="muted">En iPhone: abre esta dirección desde Safari, pulsa Compartir y elige <b>Añadir a pantalla de inicio</b>. Después abre el icono INVENTA. En Android: menú de Chrome → Instalar aplicación.</p><p class="muted" style="margin-top:10px">Los archivos básicos se guardan tras la primera carga. Los datos de prueba son solo locales.</p><button class="btn" style="margin-top:12px" onclick="hideModal()">Entendido</button>`;}else if(m==='unexpected'){body=`<h2>Artículo no listado</h2><p class="muted">Registra provisionalmente un artículo encontrado en ${activeLoc}. En la aplicación definitiva se comunicará una incidencia al responsable.</p><div class="field" style="margin-top:11px"><label for="unknownCode">Código de artículo</label><input class="input" id="unknownCode" placeholder="Ej. PRD0009999"></div><div class="field"><label for="unknownName">Descripción (opcional)</label><input class="input" id="unknownName" placeholder="Artículo encontrado"></div><button class="btn" onclick="addUnexpected()">Añadir a esta ubicación</button><button class="back" onclick="hideModal()">Cancelar</button><p id="modalError" class="muted"></p>`;}else if(m==='missing'){const rem=items(activeLoc).filter(p=>!getLoc(activeLoc).counts[p.id]).length;body=`<h2>Quedan artículos sin revisar</h2><p class="muted">Debes contar o marcar «No encontrado» en ${rem} artículo(s) antes de cerrar ${activeLoc}.</p><button class="btn" style="margin-top:11px" onclick="hideModal()">Seguir contando</button>`;}else if(m==='emptycount'){body=`<h2>Sin cantidades</h2><p class="muted">Todavía no hay unidades apuntadas. Si el producto no está en esta ubicación, utiliza «No encontrado».</p><button class="btn" style="margin-top:10px" onclick="markNotFound()">No encontrado</button><button class="btn-outline" style="width:100%;margin-top:8px" onclick="hideModal()">Seguir contando</button>`;}
$('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)hideModal()"><div class="modal">${body}</div></div>`;}
function hideModal(){$('overlay').innerHTML='';modal='';}
function removeEntry(i){hideModal();openBreakdown();if(i>=0&&i<pendingEntries.length)openEntryEdit(i);}
function addUnexpected(){const code=$('unknownCode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,28);if(!code){$('modalError').textContent='Introduce un código.';return;}if(items(activeLoc).some(p=>p.id===code)){$('modalError').textContent='Ese artículo ya existe en la ubicación.';return;}const name=$('unknownName').value.trim().slice(0,90);getLoc(activeLoc).extras[code]={name:name||'Artículo encontrado no previsto'};data.events.push({what:'Artículo provisional',loc:activeLoc,article:code,at:new Date().toISOString()});save();hideModal();go('articles');}
function installHelp(){hideModal();showModal('help')}
function logout(){data.worker='';activeAisle='';save();hideModal();go('login')}
function resetDemo(){if(!confirm('¿Borrar todos los recuentos de esta DEMO en este dispositivo?'))return;clearDraft('Operario 1');clearDraft('Operario 2');data=blank();save();hideModal();go('login')}
window.addEventListener('online',()=>{if(screen==='locations')render()});window.addEventListener('offline',()=>{if(screen==='locations')render()});
window.addEventListener('load',initInventaUpdates);
if(data.worker){const d=readDraft(data.worker);if(d)restoreDraft(d);}
render();
</script></body></html>
