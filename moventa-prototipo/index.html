<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="./manifest.webmanifest"><title>MOVENTA</title><style>body{font:16px system-ui;margin:0;background:#f2f6fb;color:#13283e}header{background:#102a43;color:white;padding:24px}main{max-width:700px;margin:30px auto;padding:18px}form,.app{background:white;padding:20px;border-radius:15px;margin-bottom:15px}input,button{display:block;padding:12px;margin:12px 0;width:100%;box-sizing:border-box}button{background:#123b62;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#123b62}#message{min-height:1.5em}</style></head><body><header><h1>MOVENTA</h1><p>Acceso a tus aplicaciones</p></header><main><form id="login"><h2>Iniciar sesión</h2><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><section id="dashboard" hidden><h2>Mis aplicaciones</h2><div id="apps"></div><button id="logout">Cerrar sesión</button></section><p id="message" role="status" aria-live="polite"></p><p>Prototipo: los módulos todavía pueden requerir autenticación independiente.</p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {aplicacionesPermitidas} from './app-access.js';
const client=createClient('https://wlejxnpphysogrzcxjfh.supabase.co','REEMPLAZAR_CON_CLAVE_PUBLICABLE');
const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),apps=document.querySelector('#apps'),message=document.querySelector('#message');
const catalog={inventa:{title:'INVENTA',url:'https://josegude-ux.github.io/INVENTA-/'},kontrola:{title:'KONTROLA',url:'https://josegude-ux.github.io/KONTROLA/'}};
async function refresh(){try{const {data:{user},error}=await client.auth.getUser();if(error)throw error;login.hidden=!!user;dash.hidden=!user;apps.replaceChildren();if(!user)return;const allowed=await aplicacionesPermitidas(client);message.textContent=allowed.length?'':'No tienes aplicaciones asignadas todavía.';for(const row of allowed){const item=catalog[row.app_id];if(!item)continue;const card=document.createElement('article');card.className='app';const title=document.createElement('h3');title.textContent=item.title;const link=document.createElement('a');link.href=item.url;link.textContent='Abrir '+item.title;link.rel='noopener';card.append(title,link);apps.append(card)}}catch(e){message.textContent='No se pudieron consultar los permisos. Comprueba la configuración.';console.error(e)}}
login.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Comprobando acceso…';const {error}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});document.querySelector('#password').value='';if(error){message.textContent='No se pudo iniciar sesión.';return}message.textContent='';await refresh()});
document.querySelector('#logout').addEventListener('click',async()=>{await client.auth.signOut();message.textContent='Sesión cerrada';await refresh()});await refresh();
</script></body></html>
