<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="./manifest.webmanifest"><title>MOVENTA</title><style>body{font:16px system-ui;margin:0;background:#f2f6fb;color:#13283e}header{background:#102a43;color:white;padding:24px}main{max-width:700px;margin:30px auto;padding:18px}form,.app{background:white;padding:20px;border-radius:15px;margin-bottom:15px}input,button{display:block;padding:12px;margin:12px 0;width:100%;box-sizing:border-box}button{background:#123b62;color:white;border:0;border-radius:8px;cursor:pointer}a{color:#123b62}#message{min-height:1.5em}</style></head><body><header><h1>MOVENTA</h1><p>Acceso a tus aplicaciones</p></header><main><form id="login"><h2>Iniciar sesión</h2><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><section id="dashboard" hidden><h2>Mis aplicaciones</h2><div id="apps"></div><button id="logout">Cerrar sesión</button></section><section id="module" hidden><button id="back" type="button">Volver a MOVENTA</button><div id="module-host"></div></section><p id="message" role="status" aria-live="polite"></p><p>Prototipo: los módulos todavía pueden requerir autenticación independiente.</p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {aplicacionesPermitidas} from './app-access.js';
import {createModuleController} from './module-controller.js';
const client=createClient('https://wlejxnpphysogrzcxjfh.supabase.co','sb_publishable_gPeof-fUW3yITvNXqsjHVw_-PjB1Fyd');
const login=document.querySelector('#login'),dash=document.querySelector('#dashboard'),apps=document.querySelector('#apps'),message=document.querySelector('#message');
const catalog={inventa:{title:'INVENTA'},kontrola:{title:'KONTROLA'}};
const modulePanel=document.querySelector('#module'),host=document.querySelector('#module-host');
const controller=createModuleController({
 authorize:async(user,appId)=>{const {data:{user:current},error}=await client.auth.getUser();if(error||!current||current.id!==user.id)return false;return (await aplicacionesPermitidas(client)).some(row=>row.app_id===appId);},
 mount:async({appId})=>{if(appId!=='inventa')throw new Error('KONTROLA pendiente de SSO');const frame=document.createElement('iframe');frame.title='Prueba de integración INVENTA';frame.src='./inventa-integration-demo.html';frame.style.cssText='width:100%;min-height:360px;border:1px solid #cbd5e1;border-radius:12px';host.replaceChildren(frame);modulePanel.hidden=false;dash.hidden=true;},
 unmount:async()=>{host.replaceChildren();modulePanel.hidden=true;},
 onState:state=>{if(state==='denied'||state==='error')message.textContent='Acceso bloqueado o integración no disponible.';}
});
document.querySelector('#back').addEventListener('click',async()=>{await controller.close();await refresh();});
client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')setTimeout(()=>{void controller.close('signed-out');void refresh();},0);});
async function refresh(){try{const {data:{user},error}=await client.auth.getUser();if(error)throw error;login.hidden=!!user;dash.hidden=!user;apps.replaceChildren();if(!user)return;const allowed=await aplicacionesPermitidas(client);message.textContent=allowed.length?'':'No tienes aplicaciones asignadas todavía.';for(const row of allowed){const item=catalog[row.app_id];if(!item)continue;const card=document.createElement('article');card.className='app';const title=document.createElement('h3');title.textContent=item.title;const button=document.createElement('button');button.type='button';button.textContent=row.app_id==='inventa'?'Probar integración INVENTA':'KONTROLA: integración pendiente';button.disabled=row.app_id!=='inventa';button.addEventListener('click',async()=>{message.textContent='Verificando acceso…';const ok=await controller.open(user,row.app_id);if(ok)message.textContent='Demostración de acceso integrado; no es INVENTA completa.';});card.append(title,button);apps.append(card)}}catch(e){message.textContent='No se pudieron consultar los permisos. Comprueba la configuración.';console.error(e)}}
login.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Comprobando acceso…';const {error}=await client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});document.querySelector('#password').value='';if(error){message.textContent='No se pudo iniciar sesión.';return}message.textContent='';await refresh()});
document.querySelector('#logout').addEventListener('click',async()=>{await controller.close('signed-out');await client.auth.signOut();message.textContent='Sesión cerrada';await refresh()});await refresh();
</script></body></html>
