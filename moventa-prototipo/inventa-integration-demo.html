<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVENTA · Prueba de sesión INVENTA</title><body><h1>Prueba de sesión compartida INVENTA</h1><p id="state" role="status">Comprobando sesión…</p><p id="identity"></p><a href="./index.html">Volver a MOVENTA</a><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {createInventaSessionAdapter} from './inventa-session-adapter.js';
import {createInventaAccessGate} from './inventa-access-gate.js';
const client=createClient('https://wlejxnpphysogrzcxjfh.supabase.co','sb_publishable_gPeof-fUW3yITvNXqsjHVw_-PjB1Fyd');
const state=document.querySelector('#state'),identity=document.querySelector('#identity');
const gate=createInventaAccessGate(client,{
 onAllowed(user){state.textContent='Sesión reconocida; acceso MOVENTA a INVENTA autorizado (demostración)';identity.textContent='Usuario: '+user.id;},
 onDenied(reason){identity.textContent='';state.textContent=reason==='no-permission'?'Sin permiso para INVENTA':'Sin sesión autorizada para INVENTA';},
 onError(){identity.textContent='';state.textContent='Error verificando permisos; acceso bloqueado';}
});
const adapter=createInventaSessionAdapter(client,{
 async onSession({user}){state.textContent='Verificando permiso INVENTA…';identity.textContent='';await gate.verify(user);},
 async onSignedOut(){await gate.deny('signed-out');},
 async onError(){await gate.deny('auth-error');state.textContent='No se pudo validar la sesión.';}
});
await adapter.ready;
window.addEventListener('pagehide',()=>{adapter.dispose();gate.dispose();},{once:true});
</script></body></html>
